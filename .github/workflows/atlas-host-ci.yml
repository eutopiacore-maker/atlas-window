name: Atlas Host CI
on:
  push:
    branches: [main]
    paths:
      - 'host-runtime/**'
      - 'addons/**'
      - 'pc-node/**'
      - 'world-engine.js'
      - '.github/workflows/atlas-host-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node host-runtime/test/smoke.js
      - run: node host-runtime/test/contracts.js
      - run: node --check host-runtime/atlas-host.js
      - run: node --check host-runtime/world-shim.js
      - run: node --check host-runtime/world-runner.js
  windows-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Node smoke on Windows
        run: node host-runtime/test/smoke.js
      - name: Parse PowerShell bootstrap and launcher
        shell: powershell
        run: |
          $files = @('host-runtime/Install-Atlas.ps1','host-runtime/launcher.ps1')
          foreach($file in $files){
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){ $errors | Format-List | Out-String | Write-Error; exit 1 }
          }
