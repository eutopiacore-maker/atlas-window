name: ATLAS Self-Handoff Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-self-handoff-proof.yml'
  workflow_dispatch:
    inputs:
      state_branch:
        description: Branch holding persistent ATLAS state
        required: true
        default: experiment/atlas-continuity-proof-20261010
        type: string
      expected_generation:
        description: Generation this runner must produce
        required: true
        default: '1'
        type: string
      max_generation:
        description: Stop after this generation
        required: true
        default: '3'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: atlas-self-handoff-proof
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STATE_BRANCH: ${{ inputs.state_branch || 'experiment/atlas-continuity-proof-20261010' }}
      EXPECTED_GENERATION: ${{ inputs.expected_generation || '1' }}
      MAX_GENERATION: ${{ inputs.max_generation || '3' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout persistent state
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STATE_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Execute heartbeat generation
        shell: bash
        run: |
          set -euo pipefail
          node experiments/atlas-continuity-proof/handoff.js             experiments/atlas-continuity-proof/state.json             next-state.json             "$EXPECTED_GENERATION"
          mv next-state.json experiments/atlas-continuity-proof/state.json

      - name: Commit persistent checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "atlas-continuity-bot"
          git config user.email "atlas-continuity-bot@users.noreply.github.com"
          git add experiments/atlas-continuity-proof/state.json
          git commit -m "test(continuity): self-handoff generation $EXPECTED_GENERATION"
          git push origin "HEAD:$STATE_BRANCH"
          echo "ATLAS_CHECKPOINT_COMMITTED=$EXPECTED_GENERATION"

      - name: Dispatch successor
        if: fromJSON(env.EXPECTED_GENERATION) < fromJSON(env.MAX_GENERATION)
        shell: bash
        run: |
          set -euo pipefail
          next=$((EXPECTED_GENERATION + 1))
          printf '{"ref":"main","inputs":{"state_branch":"%s","expected_generation":"%s","max_generation":"%s"}}'             "$STATE_BRANCH" "$next" "$MAX_GENERATION" > /tmp/dispatch.json
          gh api             --method POST             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/actions/workflows/atlas-self-handoff-proof.yml/dispatches"             --input /tmp/dispatch.json
          echo "ATLAS_SUCCESSOR_DISPATCHED=$next"

      - name: Final generation marker
        if: fromJSON(env.EXPECTED_GENERATION) >= fromJSON(env.MAX_GENERATION)
        run: |
          echo "ATLAS_SELF_HANDOFF_PROOF_COMPLETE=True"
          echo "ATLAS_FINAL_GENERATION=$EXPECTED_GENERATION"
