name: BIDROOMS Validate
on:
  push:
    paths:
      - "bidrooms/**"
      - ".github/workflows/bidrooms-validate.yml"
  pull_request:
    paths:
      - "bidrooms/**"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python bidrooms/scripts/validate_public_data.py
      - run: python -m py_compile bidrooms/backend/app/main.py
      - run: node --check bidrooms/assets/app.js
