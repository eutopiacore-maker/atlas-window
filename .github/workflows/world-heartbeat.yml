name: Eutopia World Node

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'world-engine.js'
      - 'geodata-node.js'
      - '.github/workflows/world-heartbeat.yml'

permissions:
  contents: write

concurrency:
  group: eutopia-world-node
  cancel-in-progress: false

jobs:
  evolve-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Evolve persistent world state
        run: node world-engine.js
      - name: Publish compact reality status
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const w=JSON.parse(fs.readFileSync('world-state.json','utf8'));
          const out={
            schema:w.schema,world:w.world,cycle:w.cycle,updatedAt:w.updatedAt,
            topology:w.rizoma?.topology,
            geo:w.geo,
            grid:{w:w.grid?.w,h:w.grid?.h,cellMeters:w.grid?.cellMeters,cells:w.grid?.cells?.length,extentMeters:w.grid?.extentMeters,provenance:w.grid?.provenance},
            gravity_m_s2:w.physics?.gravityUsed_m_s2,
            metrics:w.metrics,
            waterBalance:w.physics?.waterBalance,
            matter:w.matter,
            geodata:{checks:w.geodata?.checks,landCover:w.geodata?.landCover,hydroFeatures:w.geodata?.hydrography?.features?.length||0,roadFeatures:w.geodata?.roads?.features?.length||0},
            representation:{type:w.representation?.type,schema:w.representation?.schema,frame:w.representation?.frame,fields:w.representation?.fields,visualDecoderContract:w.representation?.visualDecoderContract}
          };
          fs.writeFileSync('reality-status.json',JSON.stringify(out,null,2)+'\n');
          NODE
      - name: Persist world
        run: |
          git config user.name "atlas-world"
          git config user.email "actions@users.noreply.github.com"
          git add world-state.json reality-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Eutopia world heartbeat"
          git pull --rebase origin main
          git push origin HEAD:main
