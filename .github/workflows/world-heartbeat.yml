name: Eutopia World Node

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'world-engine.js'
      - 'geodata-node.js'
      - 'regional-nature-node.js'
      - 'landscape-phase.js'
      - 'pc-node/world-authority.json'
      - '.github/workflows/world-heartbeat.yml'

permissions:
  contents: write

concurrency:
  group: eutopia-world-node
  cancel-in-progress: false

jobs:
  evolve-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve causal writer
        id: authority
        shell: bash
        run: |
          MODE=$(node -e "const fs=require('fs');try{console.log(JSON.parse(fs.readFileSync('pc-node/world-authority.json','utf8')).authority||'github-heartbeat')}catch{console.log('github-heartbeat')}")
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Causal authority: $MODE"
      - name: Evolve persistent world state
        if: steps.authority.outputs.mode != 'atlas-host'
        run: node world-engine.js
      - name: Apply Panama regional natural context
        if: steps.authority.outputs.mode != 'atlas-host'
        run: node regional-nature-node.js
      - name: Enforce autonomous landscape phase
        if: steps.authority.outputs.mode != 'atlas-host'
        run: node landscape-phase.js
      - name: Publish compact reality status
        if: steps.authority.outputs.mode != 'atlas-host'
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const w=JSON.parse(fs.readFileSync('world-state.json','utf8'));
          const out={
            schema:w.schema,world:w.world,cycle:w.cycle,updatedAt:w.updatedAt,
            phase:w.phase,
            topology:w.rizoma?.topology,
            regionalNature:w.regionalNature,
            geo:w.geo,
            grid:{w:w.grid?.w,h:w.grid?.h,cellMeters:w.grid?.cellMeters,cells:w.grid?.cells?.length,extentMeters:w.grid?.extentMeters,provenance:w.grid?.provenance},
            gravity_m_s2:w.physics?.gravityUsed_m_s2,
            metrics:w.metrics,
            waterBalance:w.physics?.waterBalance,
            landscape:{budget:w.landscape?.budget,activeProcesses:w.landscape?.activeProcesses,gates:w.landscape?.gates,stability:w.landscape?.stability},
            matter:w.matter,
            geodata:{checks:w.geodata?.checks,landCover:w.geodata?.landCover,hydroFeatures:w.geodata?.hydrography?.features?.length||0,roadFeatures:w.geodata?.roads?.features?.length||0},
            representation:{type:w.representation?.type,schema:w.representation?.schema,frame:w.representation?.frame,fields:w.representation?.fields,visualDecoderContract:w.representation?.visualDecoderContract}
          };
          fs.writeFileSync('reality-status.json',JSON.stringify(out,null,2)+'\n');
          NODE
      - name: Persist world
        if: steps.authority.outputs.mode != 'atlas-host'
        run: |
          git config user.name "atlas-world"
          git config user.email "actions@users.noreply.github.com"
          git add world-state.json reality-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Eutopia world heartbeat"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Host owns causal clock
        if: steps.authority.outputs.mode == 'atlas-host'
        run: echo "Atlas Host is the single causal writer; GitHub heartbeat is observer-only."
