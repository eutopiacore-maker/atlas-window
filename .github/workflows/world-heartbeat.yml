name: Eutopia World Node

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'world-engine.js'
      - '.github/workflows/world-heartbeat.yml'

permissions:
  contents: write

concurrency:
  group: eutopia-world-node
  cancel-in-progress: false

jobs:
  evolve-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Evolve persistent world state
        run: node world-engine.js
      - name: Persist world
        run: |
          git config user.name "atlas-world"
          git config user.email "actions@users.noreply.github.com"
          git add world-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Eutopia world heartbeat"
          git pull --rebase origin main
          git push origin HEAD:main
