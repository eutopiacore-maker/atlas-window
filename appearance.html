<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Atlas Layer 3</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}#source{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;z-index:1}#out{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:2}</style>
<iframe id="source" src="dynamics.html?embedded=1&l3source=1"></iframe><canvas id="out"></canvas>
<script>
(function(){'use strict';
/* CAPA 3: observa simultaneamente el estado estructural de Capa 1 (world-state)
   y la imagen animada producida por Capa 2. No posee geometria propia. */
var src=document.getElementById('source'),out=document.getElementById('out'),ctx=out.getContext('2d',{alpha:false}),sourceCanvas=null,state=null,dpr=1;
var work=document.createElement('canvas'),W=320,H=480,wctx=work.getContext('2d',{willReadFrequently:true});work.width=W;work.height=H;
function resize(){dpr=Math.min(devicePixelRatio||1,2);out.width=Math.max(1,innerWidth*dpr);out.height=Math.max(1,innerHeight*dpr);out.style.width=innerWidth+'px';out.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize,{passive:true});
function findCanvas(){try{sourceCanvas=src.contentDocument&&src.contentDocument.querySelector('canvas')}catch(e){sourceCanvas=null}}
src.addEventListener('load',function(){setTimeout(findCanvas,80);setTimeout(findCanvas,400)});
async function syncState(){try{var r=await fetch('./world-state.json?v='+Date.now(),{cache:'no-store'});if(r.ok)state=await r.json()}catch(e){}}syncState();setInterval(syncState,5000);
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function frame(){if(!sourceCanvas||!sourceCanvas.width)findCanvas();if(sourceCanvas&&sourceCanvas.width){wctx.drawImage(sourceCanvas,0,0,W,H);var im=wctx.getImageData(0,0,W,H),p=im.data;var solar=.55,cloud=.35,moist=.45;if(state&&state.weather){solar=Number(state.weather.solar||solar);cloud=Number(state.weather.cloud||cloud)}if(state&&state.metrics)moist=Number(state.metrics.meanSoilMoisture||moist);for(var y=0;y<H;y++)for(var x=0;x<W;x++){var i=(y*W+x)*4,r=p[i],g=p[i+1],b=p[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=mx-mn;var sky=(b>r*1.03&&b>g*.92&&y<H*.75),veg=(g>r*1.06&&g>b*.78&&sat>10),ground=!sky&&!veg&&r>g*.82&&g>b*.88;if(sky){var q=(1-y/H);p[i]=clamp(r*(.95+solar*.08)+q*8,0,255);p[i+1]=clamp(g*(.97+solar*.06)+q*10,0,255);p[i+2]=clamp(b*(1.02+solar*.05)+q*12,0,255)}else if(veg){p[i]=clamp(r*.82,0,255);p[i+1]=clamp(g*(1.03+solar*.05),0,255);p[i+2]=clamp(b*.82,0,255)}else if(ground){var wet=1-moist*.12;p[i]=clamp(r*wet*(.98+solar*.04),0,255);p[i+1]=clamp(g*wet*(.97+solar*.03),0,255);p[i+2]=clamp(b*wet*.92,0,255)}}wctx.putImageData(im,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(work,0,0,innerWidth,innerHeight)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script>
