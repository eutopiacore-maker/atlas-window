<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Atlas Layer 3</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7fa4b4}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:14px;background:#07100dcc;color:#fff;font:11px -apple-system,sans-serif;letter-spacing:.08em;z-index:5}</style><canvas id="c"></canvas><div id="msg" class="msg">CAPA 3 · INICIANDO</div><script>(function(){'use strict';var cv=document.getElementById('c'),ctx=cv.getContext('2d'),msg=document.getElementById('msg'),state=null,dpr=1;function resize(){dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.max(1,innerWidth*dpr);cv.height=Math.max(1,innerHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize,{passive:true});resize();function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function draw(){var w=innerWidth,h=innerHeight,t=Date.now()/1000,solar=state&&state.weather?Number(state.weather.solar||.65):.65,cloud=state&&state.weather?Number(state.weather.cloud||.35):.35;var sky=ctx.createLinearGradient(0,0,0,h*.62);sky.addColorStop(0,solar>.3?'#6fa4bc':'#71808b');sky.addColorStop(1,'#d6d1ba');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);var hz=h*.55;ctx.fillStyle='#5e7448';ctx.beginPath();ctx.moveTo(0,hz);for(var x=0;x<=w;x+=10){ctx.lineTo(x,hz-26*Math.sin(x/w*3.2)-11*Math.sin(x/w*8.7))}ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();var gr=ctx.createLinearGradient(0,hz,0,h);gr.addColorStop(0,'#85845b');gr.addColorStop(1,'#625f43');ctx.fillStyle=gr;ctx.fillRect(0,hz,w,h-hz);ctx.strokeStyle='rgba(45,75,39,.8)';ctx.lineWidth=1;for(var i=0;i<150;i++){var px=((i*83)%997)/997*w,py=hz+(((i*137)%991)/991)*(h-hz),s=Math.sin(t*1.4+i)*2;ctx.beginPath();ctx.moveTo(px,py);ctx.quadraticCurveTo(px+s,py-6,px+s*.6,py-13);ctx.stroke()}var sx=w*.77,sy=h*.2,r=Math.min(w,h)*.18,gl=ctx.createRadialGradient(sx,sy,0,sx,sy,r);gl.addColorStop(0,'rgba(255,238,181,'+(0.42+solar*.3)+')');gl.addColorStop(1,'rgba(255,238,181,0)');ctx.fillStyle=gl;ctx.fillRect(0,0,w,h*.55);ctx.fillStyle='rgba(255,255,255,'+(cloud*.22)+')';for(var j=0;j<5;j++){var cx=((j*211+70)%900)/900*w,cy=70+(j%3)*55;ctx.beginPath();ctx.ellipse(cx,cy,55,16,0,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}async function sync(){try{var r=await fetch('./world-state.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);state=await r.json();msg.textContent='CAPA 3 · LIVE';setTimeout(function(){msg.style.display='none'},600)}catch(e){msg.style.display='block';msg.textContent='CAPA 3 · REINTENTANDO'}}sync();setInterval(sync,15000);requestAnimationFrame(draw)})();</script>
