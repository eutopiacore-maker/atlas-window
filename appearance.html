<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Atlas Layer 3</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
#source{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;z-index:1}
#out{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:2}
</style>
<iframe id="source" src="dynamics.html?embedded=1&l3source=1"></iframe>
<canvas id="out"></canvas>
<script>
(function(){
'use strict';
var src=document.getElementById('source'),out=document.getElementById('out'),ctx=out.getContext('2d',{alpha:false}),dpr=1,sourceCanvas=null,state=null;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);out.width=Math.max(1,innerWidth*dpr);out.height=Math.max(1,innerHeight*dpr);out.style.width=innerWidth+'px';out.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize,{passive:true});resize();
function findCanvas(){try{sourceCanvas=src.contentDocument&&src.contentDocument.querySelector('canvas')}catch(e){sourceCanvas=null}}
src.addEventListener('load',function(){setTimeout(findCanvas,120);setTimeout(findCanvas,600)});
async function syncState(){try{var r=await fetch('./world-state.json?v='+Date.now(),{cache:'no-store'});if(r.ok)state=await r.json()}catch(e){}}
syncState();setInterval(syncState,15000);
function frame(){
  if(!sourceCanvas||!sourceCanvas.width){findCanvas();requestAnimationFrame(frame);return}
  try{
    var solar=state&&state.weather?Number(state.weather.solar||.55):.55;
    var cloud=state&&state.weather?Number(state.weather.cloud||.35):.35;
    var humid=state&&state.metrics?Number(state.metrics.meanSoilMoisture||.45):.45;
    ctx.save();ctx.clearRect(0,0,innerWidth,innerHeight);
    ctx.filter='contrast('+(1.08+solar*.08)+') saturate('+(1.04+humid*.12)+') brightness('+(0.94+solar*.12)+')';
    ctx.drawImage(sourceCanvas,0,0,innerWidth,innerHeight);ctx.filter='none';
    ctx.globalCompositeOperation='soft-light';
    var light=ctx.createLinearGradient(0,0,0,innerHeight);light.addColorStop(0,'rgba(255,238,205,'+(0.05+solar*.11)+')');light.addColorStop(.58,'rgba(255,255,255,0)');light.addColorStop(1,'rgba(18,16,12,'+(0.04+cloud*.08)+')');ctx.fillStyle=light;ctx.fillRect(0,0,innerWidth,innerHeight);
    ctx.globalCompositeOperation='source-over';ctx.restore();
  }catch(e){out.style.display='none';src.style.filter='contrast(1.1) saturate(1.08)'}
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
})();
</script>
