<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Atlas Layer 3</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}#source{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;z-index:1}#out{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:2}</style>
<iframe id="source" src="dynamics.html?embedded=1&l3source=1"></iframe><canvas id="out"></canvas>
<script>
(function(){'use strict';
var src=document.getElementById('source'),out=document.getElementById('out'),ctx=out.getContext('2d',{alpha:false}),sourceCanvas=null,state=null,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);out.width=Math.max(1,innerWidth*dpr);out.height=Math.max(1,innerHeight*dpr);out.style.width=innerWidth+'px';out.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize,{passive:true});
function findCanvas(){try{sourceCanvas=src.contentDocument&&src.contentDocument.querySelector('canvas')}catch(e){sourceCanvas=null}}
src.addEventListener('load',function(){setTimeout(findCanvas,80);setTimeout(findCanvas,400)});
async function syncState(){try{var r=await fetch('./world-state.json?v='+Date.now(),{cache:'no-store'});if(r.ok)state=await r.json()}catch(e){}}syncState();setInterval(syncState,15000);
function frame(){if(!sourceCanvas||!sourceCanvas.width)findCanvas();if(sourceCanvas&&sourceCanvas.width){var solar=.55,cloud=.35,moist=.45;if(state&&state.weather){solar=Number(state.weather.solar||solar);cloud=Number(state.weather.cloud||cloud)}if(state&&state.metrics)moist=Number(state.metrics.meanSoilMoisture||moist);ctx.save();ctx.clearRect(0,0,innerWidth,innerHeight);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.filter='contrast('+(1.05+solar*.08)+') saturate('+(1.04+moist*.10)+') brightness('+(0.94+solar*.10-cloud*.05)+')';ctx.drawImage(sourceCanvas,0,0,innerWidth,innerHeight);ctx.filter='none';var sun=ctx.createRadialGradient(innerWidth*.72,innerHeight*.18,0,innerWidth*.72,innerHeight*.18,innerWidth*.75);sun.addColorStop(0,'rgba(255,238,195,'+(solar*.13)+')');sun.addColorStop(1,'rgba(255,238,195,0)');ctx.fillStyle=sun;ctx.fillRect(0,0,innerWidth,innerHeight);ctx.globalCompositeOperation='multiply';var depth=ctx.createLinearGradient(0,innerHeight*.35,0,innerHeight);depth.addColorStop(0,'rgba(30,38,32,0)');depth.addColorStop(1,'rgba(30,28,20,'+(.05+cloud*.035)+')');ctx.fillStyle=depth;ctx.fillRect(0,0,innerWidth,innerHeight);ctx.restore()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script>
