<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Atlas Layer 3</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8da5ae}.msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:14px;background:#07100dcc;color:#fff;font:11px -apple-system,sans-serif;letter-spacing:.08em;z-index:5}</style>
<div id="msg" class="msg">CAPA 3 · INICIANDO</div>
<script type="module">
const msg=document.getElementById('msg');
let renderer=null;
async function boot(){
  try{
    const sceneModule=await import('./appearance-scene.js?v=20');
    const renderModule=await import('./photoreal-landscape.js?v=20');
    renderer=new renderModule.AtlasPhotorealLandscape();
    async function sync(){
      try{
        const r=await fetch('./world-state.json?v='+Date.now(),{cache:'no-store'});
        if(!r.ok)throw new Error('HTTP '+r.status);
        const state=await r.json();
        const packet=sceneModule.buildAppearanceScenePacket(state,{fov:58,height_m:1.65});
        renderer.render(packet,state);
        msg.textContent='CAPA 3 · LIVE';
        setTimeout(()=>{msg.style.display='none'},700);
      }catch(e){
        console.error(e);
        msg.style.display='block';
        msg.textContent='CAPA 3 · REINTENTANDO';
      }
    }
    await sync();
    setInterval(sync,15000);
  }catch(e){
    console.error(e);
    msg.textContent='CAPA 3 · ERROR DE ARRANQUE';
  }
}
boot();
</script>
