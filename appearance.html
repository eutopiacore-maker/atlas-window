<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Atlas Layer 3</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
#source{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
#out{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
</style>
<iframe id="source" src="dynamics.html?embedded=1"></iframe>
<canvas id="out"></canvas>
<script>
(function(){
'use strict';
var src=document.getElementById('source'),out=document.getElementById('out'),ctx=out.getContext('2d',{alpha:false}),dpr=1,sourceCanvas=null;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);out.width=Math.max(1,innerWidth*dpr);out.height=Math.max(1,innerHeight*dpr);out.style.width=innerWidth+'px';out.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize,{passive:true});resize();
function findCanvas(){try{sourceCanvas=src.contentDocument&&src.contentDocument.querySelector('canvas')}catch(e){sourceCanvas=null}}
src.addEventListener('load',function(){setTimeout(findCanvas,250);setTimeout(findCanvas,1000)});
function frame(){
  if(!sourceCanvas||!sourceCanvas.width){findCanvas();requestAnimationFrame(frame);return}
  try{
    ctx.save();
    ctx.clearRect(0,0,innerWidth,innerHeight);
    ctx.filter='contrast(1.12) saturate(1.12) brightness(1.02)';
    ctx.drawImage(sourceCanvas,0,0,innerWidth,innerHeight);
    ctx.filter='none';
    ctx.globalCompositeOperation='soft-light';
    var g=ctx.createLinearGradient(0,0,0,innerHeight);g.addColorStop(0,'rgba(255,244,220,.10)');g.addColorStop(.55,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(25,20,12,.08)');ctx.fillStyle=g;ctx.fillRect(0,0,innerWidth,innerHeight);
    ctx.globalCompositeOperation='source-over';
    ctx.restore();
  }catch(e){out.style.display='none';src.style.filter='contrast(1.12) saturate(1.12) brightness(1.02)'}
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
})();
</script>
