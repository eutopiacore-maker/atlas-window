<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Atlas Dynamics</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091312;touch-action:none}</style><script type="module">import{AtlasDynamicsObserver}from'./dynamics.js';const observer=new AtlasDynamicsObserver(document.body);async function sync(){try{const s=await fetch(`world-state.json?${Date.now()}`,{cache:'no-store'}).then(r=>r.json());observer.applyState(s)}catch(e){console.warn('Atlas dynamics sync',e)}}sync();setInterval(sync,15000);</script>
