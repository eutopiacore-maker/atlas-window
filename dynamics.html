<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Atlas Dynamics</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091312;touch-action:none}</style><script type="module">import*as T from'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';const S=new T.Scene,C=new T.PerspectiveCamera(58,innerWidth/innerHeight,.1,240),R=new T.WebGLRenderer({antialias:true}),G=new T.Group(),H=new T.HemisphereLight(0xdcecff,0x443826,1.5),L=new T.DirectionalLight(0xffd8a3,3.2);R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio||1,1.5));R.outputColorSpace=T.SRGBColorSpace;R.toneMapping=T.ACESFilmicToneMapping;R.shadowMap.enabled=true;document.body.append(R.domElement);L.position.set(-18,25,15);L.castShadow=true;S.add(H,L,G);let W=null,z=.315,b0=0,ys=.12,wind=.2,agents=new Map,plants=[],lastSync=performance.now(),transition=3500;function cell(w,x,y){x=Math.max(0,Math.min(w.grid.w-1,x));y=Math.max(0,Math.min(w.grid.h-1,y));return w.grid.cells[y*w.grid.w+x]}function Y(q){return((+q?.elevation||0)-b0)*ys}function E(w,x,y){return Y(cell(w,Math.floor(x*w.grid.w),Math.floor(y*w.grid.h)))}function P(w,x,y){return[(x-.5)*(w.grid.w-1)*z,(y-.5)*(w.grid.h-1)*z]}function mat(c,r=.88){return new T.MeshStandardMaterial({color:c,roughness:r})}function wipeGround(){for(const o of [...G.children])if(o.userData.static){G.remove(o);o.traverse?.(n=>{n.geometry?.dispose?.();n.material?.dispose?.()})}}function ground(w){let v=[],co=[],ix=[];for(let y=0;y<w.grid.h;y++)for(let x=0;x<w.grid.w;x++){let q=cell(w,x,y),m=q.soil?.moisture||0,k=new T.Color().setHSL(.09,.34,.25+m*.1);v.push((x-(w.grid.w-1)/2)*z,Y(q),(y-(w.grid.h-1)/2)*z);co.push(k.r,k.g,k.b)}for(let y=0;y<w.grid.h-1;y++)for(let x=0;x<w.grid.w-1;x++){let a=y*w.grid.w+x,b=a+1,d=a+w.grid.w,e=d+1;ix.push(a,d,b,b,d,e)}let q=new T.BufferGeometry();q.setAttribute('position',new T.Float32BufferAttribute(v,3));q.setAttribute('color',new T.Float32BufferAttribute(co,3));q.setIndex(ix);q.computeVertexNormals();let m=new T.Mesh(q,new T.MeshStandardMaterial({vertexColors:true,roughness:.98}));m.receiveShadow=true;m.userData.static=true;G.add(m)}function makePerson(col=0xd7c8ae,scale=.8){let g=new T.Group(),b=new T.Mesh(new T.CapsuleGeometry(.12*scale,.38*scale,3,6),mat(col)),h=new T.Mesh(new T.SphereGeometry(.15*scale,10,7),mat(col));b.position.y=.5*scale;h.position.y=.98*scale;g.add(b,h);g.userData.body=b;g.userData.baseY=0;return g}function makePlant(p){let g=new T.Group(),kind=p.kind||p.species,bio=Math.max(.02,p.biomassKg??p.biomass??.02);if(kind==='grass'){for(let i=0;i<4;i++){let h=.12+Math.min(.45,bio*.7)+(i%2)*.03,q=new T.Mesh(new T.ConeGeometry(.015,h,3),mat(0x3d7138,.95));q.position.set((i-1.5)*.025,h/2,0);g.add(q)}}else{let s=.3+Math.min(.9,Math.sqrt(bio)*.3),tr=new T.Mesh(new T.CylinderGeometry(.035*s,.06*s,.55*s,6),mat(0x63452e)),cr=new T.Mesh(new T.IcosahedronGeometry(.25*s,1),mat(0x326039,.92));tr.position.y=.28*s;cr.position.y=.62*s;g.add(tr,cr)}g.userData.plant=true;return g}function syncEntities(w){const now=performance.now(),seen=new Set;for(const a of [...(w.agents||[]),...(w.atlas?[{...w.atlas,id:w.atlas.id||'atlas',_atlas:true}]:[])]){let id=String(a.id||a.name||Math.random()),g=agents.get(id);if(!g){g=makePerson(a._atlas?0xd39a34:0xd8c9b0,a._atlas?1.05:.82);G.add(g);agents.set(id,g);let [x,d]=P(w,a.x,a.y);g.position.set(x,E(w,a.x,a.y),d);g.userData.from={x:g.position.x,y:g.position.y,z:g.position.z}}else g.userData.from={x:g.position.x,y:g.position.y,z:g.position.z};let[x,d]=P(w,a.x,a.y);g.userData.to={x,y:E(w,a.x,a.y),z:d};g.userData.intent={tx:a.tx,ty:a.ty,need:a.need||a.intent||'idle'};g.userData.t0=now;seen.add(id)}for(const[id,g]of agents)if(!seen.has(id)){G.remove(g);agents.delete(id)}for(const p of plants)G.remove(p);plants=[];for(const p of w.plants||[]){let g=makePlant(p),[x,d]=P(w,p.x,p.y);g.position.set(x,E(w,p.x,p.y),d);g.userData.phase=(String(p.id||'').length*.73+p.x*7+p.y*11)%6.28;G.add(g);plants.push(g)}lastSync=now}function draw(w){W=w;z=(w.grid.cellMeters||4.5)*.07;b0=Math.min(...w.grid.cells.map(q=>+q.elevation||0));wind=w.weather?.wind??.2;S.background=new T.Color().setHSL(.55,.28,.42-(w.weather?.cloud??.5)*.12);S.fog=new T.FogExp2(S.background,.025);wipeGround();ground(w);syncEntities(w)}async function sync(){try{draw(await fetch(`world-state.json?${Date.now()}`,{cache:'no-store'}).then(r=>r.json()))}catch{}}let target=new T.Vector3(0,1,0),yaw=.72,pitch=-.16,dist=8.5,drag=0,lx=0,ly=0;function cam(){let p=Math.cos(pitch);C.position.set(target.x+Math.sin(yaw)*p*dist,target.y+Math.sin(-pitch)*dist,target.z+Math.cos(yaw)*p*dist);C.lookAt(target);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}cam();R.domElement.onpointerdown=e=>{drag=1;lx=e.clientX;ly=e.clientY};onpointerup=()=>drag=0;onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-lx)*.006;pitch=Math.max(-.5,Math.min(-.04,pitch-(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY;cam()};function loop(t){requestAnimationFrame(loop);for(const g of agents.values()){let f=g.userData.from,to=g.userData.to;if(f&&to){let u=Math.min(1,(t-(g.userData.t0||t))/transition),s=u*u*(3-2*u);g.position.set(f.x+(to.x-f.x)*s,f.y+(to.y-f.y)*s,f.z+(to.z-f.z)*s)}let I=g.userData.intent;if(W&&I&&Number.isFinite(I.tx)&&Number.isFinite(I.ty)){let[x,z2]=P(W,I.tx,I.ty),dx=x-g.position.x,dz=z2-g.position.z;if(Math.hypot(dx,dz)>.03){g.rotation.y=Math.atan2(dx,dz);g.userData.body.position.y=.5*(g.userData.body.scale?.y||1)+Math.sin(t*.008+(g.id||0))*.018}}}for(const p of plants)p.rotation.z=Math.sin(t*.0015+p.userData.phase)*Math.min(.12,.02+wind*.1);R.render(S,C)}sync();setInterval(sync,15000);loop(performance.now());addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam()})</script>
