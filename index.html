<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Atlas</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}#view{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}.layers{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:8px;padding:7px;border-radius:22px;background:#07100dbd;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}button{appearance:none;-webkit-appearance:none;border:1px solid #efbd6860;background:#0b1512ed;color:#eee;border-radius:16px;padding:10px 16px;font:12px -apple-system,sans-serif;letter-spacing:.08em;white-space:nowrap}button.on{border-color:#efbd68;color:#efbd68}@media(max-width:520px){button{padding:9px 12px;font-size:11px}.layers{gap:5px}}
</style>
<iframe id="view" src="world.html?embedded=1"></iframe>
<div class="layers"><button id="b1" class="on">CAPA 1</button><button id="b2">CAPA 2</button><button id="b3">CAPA 3</button></div>
<script>
(function(){var v=document.getElementById('view'),bs=[document.getElementById('b1'),document.getElementById('b2'),document.getElementById('b3')],files=['world.html?embedded=1','dynamics.html?embedded=1','appearance.html?embedded=1'];function go(n){for(var i=0;i<3;i++)bs[i].classList.toggle('on',i===n);v.src=files[n]+'&v='+Date.now();try{history.replaceState(null,'','?layer='+(n+1))}catch(e){}}for(let i=0;i<3;i++)bs[i].onclick=function(){go(i)};var q=new URLSearchParams(location.search),n=Math.max(1,Math.min(3,parseInt(q.get('layer')||'1',10)))-1;go(n)})();
</script>
