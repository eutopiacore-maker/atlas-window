<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07100d"><title>Atlas Reality</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100d;color:#f7f4ed;font-family:-apple-system,sans-serif;touch-action:none}.hud{position:fixed;inset:0;z-index:5;pointer-events:none;padding:max(15px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}.card{background:#050a0a70;border:1px solid #efbd6840;backdrop-filter:blur(14px);border-radius:16px;padding:10px 12px}.top{display:flex;justify-content:space-between;gap:8px}.brand{letter-spacing:.22em;font-size:11px}.brand b{color:#efbd68}.state{font-size:9px;text-align:right;line-height:1.55}.place{position:absolute;left:16px;top:15%;text-shadow:0 2px 14px #000}.place h1{margin:0 0 5px;font-size:23px;letter-spacing:.12em}.place div{font-size:9px;line-height:1.6}.bottom{position:absolute;left:14px;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;gap:10px;font-size:9px}.bottom span:last-child{text-align:right;color:#c0c5c4}</style></head><body><div class="hud"><div class="top"><div class="card brand"><b>ATLAS</b><br>REALITY STACK</div><div class="card state"><b id="cycle">CONECTANDO</b><br><span id="counts">SIR</span></div></div><div class="place"><h1>PENONOMÉ</h1><div id="geo">ancla provisional</div></div><div class="card bottom"><span id="truth">SIR · PROVISIONAL</span><span id="facts">leyendo realidad…</span></div></div><script type="module">import*as T from'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';const S=new T.Scene,C=new T.PerspectiveCamera(58,innerWidth/innerHeight,.1,200),R=new T.WebGLRenderer({antialias:true}),G=new T.Group,Hm=new T.HemisphereLight(0xffefd4,0x253326,2),Sun=new T.DirectionalLight(0xffc878,3);R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio||1,1.5));R.outputColorSpace=T.SRGBColorSpace;R.toneMapping=T.ACESFilmicToneMapping;document.body.prepend(R.domElement);Object.assign(R.domElement.style,{position:'fixed',inset:0,zIndex:2,touchAction:'none'});S.add(Hm,Sun,G);let z=.315;function wipe(){while(G.children.length){const o=G.children.pop();o.traverse?.(n=>{n.geometry?.dispose?.();n.material?.dispose?.()})}}function cell(w,x,y){x=Math.max(0,Math.min(w.grid.w-1,x));y=Math.max(0,Math.min(w.grid.h-1,y));return w.grid.cells[y*w.grid.w+x]}function elev(w,x,y){return(cell(w,Math.floor(x*w.grid.w),Math.floor(y*w.grid.h))?.elevation||0)*4}function pos(w,x,y){return[(x-.5)*(w.grid.w-1)*z,(y-.5)*(w.grid.h-1)*z]}function ground(w){const v=[],co=[],ix=[];for(let y=0;y<w.grid.h;y++)for(let x=0;x<w.grid.w;x++){const q=cell(w,x,y),m=q.soil?.moisture||0,o=q.soil?.organic||0,k=new T.Color().setHSL(.09+o*.035,.34+o*.18,.24+m*.12);v.push((x-(w.grid.w-1)/2)*z,(q.elevation||0)*4,(y-(w.grid.h-1)/2)*z);co.push(k.r,k.g,k.b)}for(let y=0;y<w.grid.h-1;y++)for(let x=0;x<w.grid.w-1;x++){const a=y*w.grid.w+x,b=a+1,d=a+w.grid.w,e=d+1;ix.push(a,d,b,b,d,e)}const q=new T.BufferGeometry();q.setAttribute('position',new T.Float32BufferAttribute(v,3));q.setAttribute('color',new T.Float32BufferAttribute(co,3));q.setIndex(ix);q.computeVertexNormals();G.add(new T.Mesh(q,new T.MeshStandardMaterial({vertexColors:true,roughness:.98})))}function plant(w,p){const[x,d]=pos(w,p.x,p.y),y=elev(w,p.x,p.y),bio=Math.max(.02,p.biomassKg??p.biomass??.02),kind=p.kind||p.species,mat=new T.MeshStandardMaterial({color:kind==='grass'?0x39743e:0x315b37,roughness:.9});if(kind==='grass'){const h=.1+Math.min(.45,bio*.7),q=new T.Mesh(new T.ConeGeometry(.025,h,4),mat);q.position.set(x,y+h/2,d);G.add(q)}else{const k=.2+Math.min(.9,Math.sqrt(bio)*.25),tr=new T.Mesh(new T.CylinderGeometry(.02,.04,.45*k,5),new T.MeshStandardMaterial({color:0x69472e})),cr=new T.Mesh(new T.IcosahedronGeometry(.24*k,1),mat);tr.position.set(x,y+.22*k,d);cr.position.set(x,y+.5*k,d);G.add(tr,cr)}}function person(w,a,col,k=.75){const[x,d]=pos(w,a.x,a.y),y=elev(w,a.x,a.y),q=new T.Group(),m=new T.MeshStandardMaterial({color:col}),b=new T.Mesh(new T.CapsuleGeometry(.12*k,.38*k,3,5),m),h=new T.Mesh(new T.SphereGeometry(.15*k,8,6),m);b.position.y=.5*k;h.position.y=.96*k;q.add(b,h);q.position.set(x,y,d);G.add(q)}function draw(w){wipe();z=(w.grid.cellMeters||4.5)*.07;const ir=w.representation,cloud=w.weather?.cloud??.5,solar=w.weather?.solar??0;S.background=new T.Color().setHSL(.55-.03*solar,.28,.17+.3*solar-cloud*.06);S.fog=new T.FogExp2(S.background,.032+cloud*.015);Hm.intensity=.8+solar*2.5;Sun.intensity=.3+solar*4;Sun.position.set(-20,8+solar*30,18);ground(w);const water=new T.MeshPhysicalMaterial({color:0x3b8296,roughness:.15,transparent:true,opacity:.62});for(const q of w.grid.cells)if((q.waterMm||0)>.12){const nx=q.x/(w.grid.w-1),ny=q.y/(w.grid.h-1),[x,d]=pos(w,nx,ny),a=new T.Mesh(new T.CircleGeometry(z*.47,8),water);a.rotation.x=-Math.PI/2;a.position.set(x,elev(w,nx,ny)+.02,d);G.add(a)}for(const p of ir?.entities?.plants||w.plants||[])plant(w,p);for(const a of ir?.entities?.agents||w.agents||[])person(w,a,0xe2d4bc);const at=ir?.entities?.atlas||w.atlas;if(at)person(w,at,0xd39a34,1.05);cycle.textContent=`REALITY · CICLO ${w.cycle}`;counts.textContent=`${w.metrics?.cells||w.grid.cells.length} celdas · ${w.metrics?.plants||0} plantas`;facts.textContent=`${w.grid.cellMeters} m · humedad ${Math.round((w.metrics?.meanSoilMoisture||0)*100)}% · residual ${w.metrics?.waterMassResidual_L??'—'} L`;const ok=w.provenance?.checks?.anati?.ok===true;truth.textContent=ok?'SIR · GEO VERIFICADA':'SIR · TERRENO PROVISIONAL';const a=w.geo?.anchor;geo.textContent=a?`${Number(a.lat).toFixed(5)}° N, ${Math.abs(Number(a.lon)).toFixed(5)}° W · ${ok?'oficial':'provisional'}`:'ancla no disponible'}async function sync(){try{draw(await fetch('world-state.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()))}catch{cycle.textContent='RECONECTANDO'}}let target=new T.Vector3(0,1.1,0),yaw=.72,pitch=-.13,dist=8.2,drag=0,lx=0,ly=0;function cam(){const p=Math.cos(pitch);C.position.set(target.x+Math.sin(yaw)*p*dist,target.y+Math.sin(-pitch)*dist,target.z+Math.cos(yaw)*p*dist);C.lookAt(target)}cam();R.domElement.onpointerdown=e=>{drag=1;lx=e.clientX;ly=e.clientY};onpointerup=()=>drag=0;onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-lx)*.006;pitch=Math.max(-.48,Math.min(-.05,pitch-(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY;cam()};sync();setInterval(sync,15000);(function loop(){requestAnimationFrame(loop);R.render(S,C)})();addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)})</script></body></html>
