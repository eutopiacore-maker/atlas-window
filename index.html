<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#07100d"><title>Atlas Window</title><style>:root{--g:#efbd68;--glass:rgba(5,10,10,.38);--line:rgba(239,189,104,.22);--t:#f7f4ed;--m:#b7bdbe}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100d;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}.shade{position:fixed;inset:0;z-index:3;background:linear-gradient(180deg,rgba(0,4,6,.14),transparent 48%,rgba(0,4,6,.36));pointer-events:none}.hud{position:fixed;inset:0;z-index:5;padding:max(15px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));pointer-events:none;transition:opacity .35s}.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-radius:18px;box-shadow:0 12px 36px rgba(0,0,0,.22)}.top{display:flex;justify-content:space-between;gap:10px}.brand{padding:10px 12px}.brand b{letter-spacing:.27em;font-size:12px}.brand small{display:block;margin-top:4px;color:var(--g);letter-spacing:.28em;font-size:8px}.live{padding:10px 12px;font-size:10px;line-height:1.55;text-align:right}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#70d776;box-shadow:0 0 11px #70d776;margin-right:6px}.place{position:absolute;left:18px;top:15%;text-shadow:0 2px 16px #000}.place h1{font-size:24px;letter-spacing:.13em;margin:0 0 6px}.place div{font-size:10px;line-height:1.75;letter-spacing:.08em}.atlas{position:absolute;right:16px;top:19%;width:min(210px,44vw);padding:12px}.atlas b{display:block;color:var(--g);font-size:9px;letter-spacing:.12em;margin-bottom:6px}.atlas div{font-size:10px;line-height:1.55}.status{position:absolute;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));padding:11px 13px;display:flex;justify-content:space-between;gap:12px;align-items:center}.status b{color:var(--g);font-size:9px;letter-spacing:.11em}.status span{font-size:9px;color:var(--m);text-align:right}.immersive .hud{opacity:0;pointer-events:none}</style></head><body><div class="shade"></div><div class="hud"><div class="top"><div class="glass brand"><b>ATLAS</b><small>VENTANA</small></div><div class="glass live"><div><span class="dot"></span><span id="worldState">MUNDO CAUSAL</span></div><div id="sourceState">leyendo estado…</div></div></div><div class="place"><h1>PENONOMÉ</h1><div>COCLÉ, PANAMÁ<br>8.51208° N, 80.35468° W</div></div><div class="glass atlas"><b>ATLAS</b><div id="atlasLine">observando la red causal</div></div><div class="glass status"><b id="cell">PA.COCLE.PENONOME</b><span id="facts">cargando mundo…</span></div></div><script src="live-world.js"></script></body></html>
