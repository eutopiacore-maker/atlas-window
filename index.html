<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Atlas Reality Stack</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100d;color:#f7f4ed;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}#view{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1;background:#07100d}#hud{position:fixed;inset:0;z-index:10;pointer-events:none;text-shadow:0 2px 12px #000}.glass{background:#07100db8;border:1px solid #efbd6860;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:16px}.brand{position:absolute;left:16px;top:max(16px,env(safe-area-inset-top));padding:12px 15px;letter-spacing:.2em;font-size:12px}.brand strong{color:#efbd68}.place{position:absolute;left:18px;top:158px}.place b{font-size:28px;letter-spacing:.09em}.place div{font-size:11px;margin-top:6px}.mode{position:absolute;top:100px;left:50%;transform:translateX(-50%);display:flex;gap:6px;white-space:nowrap;pointer-events:auto;z-index:20}.mode button{appearance:none;-webkit-appearance:none;touch-action:manipulation;border:1px solid #efbd6860;background:#07100ded;color:#eee;border-radius:18px;padding:10px 12px;font:10px -apple-system,sans-serif;letter-spacing:.05em;cursor:pointer}.mode button.on{border-color:#efbd68;color:#efbd68;background:#14201ddd}.mode button.omega{border-color:#8fbcff66}.mode button.omega.on{border-color:#8fbcff;color:#b9d5ff}.status{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top));padding:11px 14px;text-align:right;line-height:1.55}.bottom{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:10px 14px;display:flex;justify-content:space-between;gap:10px;font-size:10px}.bottom span:last-child{text-align:right;color:#c9cfcc}.badge{position:absolute;right:16px;top:158px;padding:9px 12px;font-size:10px;line-height:1.45;display:none}.badge strong{color:#efbd68}@media(max-width:760px){.mode{gap:4px}.mode button{padding:8px 8px;font-size:8px}.place b{font-size:23px}.status{font-size:10px}.brand{font-size:10px}.bottom{font-size:9px}}
</style>
<iframe id="view" src="world.html?layer=1&embedded=1"></iframe>
<div id="hud"><div class="glass brand"><strong>ATLAS</strong><br>REALITY STACK</div><div class="place"><b>PENONOMÉ</b><div id="geo">conectando geografía…</div></div><div class="mode"><button type="button" id="b1">CAPA 1 · ESTADO</button><button type="button" id="b2">CAPA 2 · DINÁMICA</button><button type="button" id="b3">CAPA 3 · REALISTA</button><button type="button" id="bo" class="omega">Ω</button></div><div class="glass status"><b id="st">REALITY</b><br><span id="stats">iniciando shell…</span></div><div id="decoder" class="glass badge"><strong>CAPA 3</strong><br><span id="decstate">renderer aislado</span></div><div class="glass bottom"><span id="truth">SIR · INICIANDO</span><span id="detail">cargando estado causal…</span></div></div>
<script>
(function(){
'use strict';
function el(id){return document.getElementById(id)}
var V=el('view'),B1=el('b1'),B2=el('b2'),B3=el('b3'),BO=el('bo'),ST=el('st'),STATS=el('stats'),GEO=el('geo'),TRUTH=el('truth'),DETAIL=el('detail'),DECODER=el('decoder'),DECSTATE=el('decstate');
var state=null;var p=new URLSearchParams(location.search);var layer=Math.max(1,Math.min(3,parseInt(p.get('layer')||'1',10)));var omega=p.get('omega')==='1';
function active(){B1.classList.toggle('on',layer===1&&!omega);B2.classList.toggle('on',layer===2&&!omega);B3.classList.toggle('on',layer===3&&!omega);BO.classList.toggle('on',omega)}
function setUrl(){var q='?layer='+layer+(omega?'&omega=1':'');try{history.replaceState(null,'',location.pathname+q)}catch(e){}}
function src(s){if(V.getAttribute('src')!==s)V.setAttribute('src',s)}
function hud(){if(!state)return;var a=state.geo&&state.geo.anchor;var cells=(state.metrics&&state.metrics.cells)||(state.grid&&state.grid.cells&&state.grid.cells.length)||0;var pop=(state.metrics&&state.metrics.population)||(state.agents&&state.agents.length)||0;GEO.textContent=a?(Number(a.lat).toFixed(5)+'° N, '+Math.abs(Number(a.lon)).toFixed(5)+'° W · '+((a.source==='miambienteMunicipalHead'||(state.provenance&&state.provenance.checks&&state.provenance.checks.anati&&state.provenance.checks.anati.ok))?'oficial':'provisional')):'ancla pendiente';if(omega){ST.textContent='MODO Ω · BINOCULAR';STATS.textContent='salida L/R simultánea';TRUTH.textContent='Ω · SALIDA ESTÉREO';DETAIL.textContent='fuente causal compartida';return}if(layer===1){ST.textContent='CAPA 1 · ESTADO · CICLO '+state.cycle;STATS.textContent=cells+' celdas · '+pop+' entidades';TRUTH.textContent='QUÉ EXISTE · DÓNDE · ESTADO';DETAIL.textContent='SIR causal'}else if(layer===2){ST.textContent='CAPA 2 · DINÁMICA · CICLO '+state.cycle;STATS.textContent='movimiento · interacción · tiempo';TRUTH.textContent='QUÉ ESTÁ PASANDO';DETAIL.textContent='estado + dinámica'}else{ST.textContent='CAPA 3 · REALISTA · CICLO '+state.cycle;STATS.textContent='apariencia desacoplada del estado';TRUTH.textContent='ESTADO + DINÁMICA → APARIENCIA';DETAIL.textContent='renderer visual aislado'}}
function render(){active();hud();DECODER.style.display='none';if(omega){src('world.html?layer=3&embedded=1');return}if(layer===1)src('world.html?layer=1&embedded=1');else if(layer===2)src('dynamics.html?embedded=1');else{src('appearance.html?embedded=1');DECODER.style.display='block';DECSTATE.textContent='REALISTA · cargando'}}
function choose(n){layer=n;omega=false;setUrl();render()}
function om(){omega=!omega;setUrl();render()}
B1.onclick=function(e){e.preventDefault();choose(1)};B2.onclick=function(e){e.preventDefault();choose(2)};B3.onclick=function(e){e.preventDefault();choose(3)};BO.onclick=function(e){e.preventDefault();om()};
['touchend','pointerup'].forEach(function(t){[B1,B2,B3,BO].forEach(function(b){b.addEventListener(t,function(e){e.stopPropagation()},{passive:true})})});
async function sync(){try{var r=await fetch('world-state.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);state=await r.json();hud();STATS.textContent=STATS.textContent;TRUTH.textContent=TRUTH.textContent;DETAIL.textContent=DETAIL.textContent}catch(e){ST.textContent='RECONNECTANDO';STATS.textContent=e.message||String(e);TRUTH.textContent='SIR · ERROR DE LECTURA';DETAIL.textContent='reintentando'}}
active();render();sync();setInterval(sync,15000);
})();
</script>
