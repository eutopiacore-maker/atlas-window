<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Atlas Reality</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100d;color:#f7f4ed;font:11px -apple-system,sans-serif;touch-action:none}#hud{position:fixed;inset:0;z-index:5;pointer-events:none;padding:max(15px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}.c{background:#050a0a70;border:1px solid #efbd6840;backdrop-filter:blur(14px);border-radius:15px;padding:9px 11px}.top{display:flex;justify-content:space-between}.b{letter-spacing:.2em}.b strong{color:#efbd68}.s{text-align:right;line-height:1.5;font-size:9px}.p{position:absolute;left:16px;top:15%;text-shadow:0 2px 14px #000}.p b{font-size:23px;letter-spacing:.12em}.p div{margin-top:5px;font-size:9px}.bt{position:absolute;left:14px;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;gap:8px;font-size:9px}.bt span:last-child{text-align:right;color:#c3c8c7}</style><div id="hud"><div class="top"><div class="c b"><strong>ATLAS</strong><br>REALITY STACK</div><div class="c s"><b id="cy">CONECTANDO</b><br><span id="ct">SIR</span></div></div><div class="p"><b>PENONOMÉ</b><div id="geo">ancla geográfica</div></div><div class="c bt"><span id="tr">SIR · VERIFICANDO</span><span id="fa">leyendo realidad…</span></div></div><script type="module">import*as T from'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';const S=new T.Scene,C=new T.PerspectiveCamera(58,innerWidth/innerHeight,.1,200),R=new T.WebGLRenderer({antialias:true}),G=new T.Group(),H=new T.HemisphereLight(0xffefd4,0x253326,2),L=new T.DirectionalLight(0xffc878,3);R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio||1,1.5));R.outputColorSpace=T.SRGBColorSpace;R.toneMapping=T.ACESFilmicToneMapping;document.body.prepend(R.domElement);Object.assign(R.domElement.style,{position:'fixed',inset:0,zIndex:2,touchAction:'none'});S.add(H,L,G);let z=.315,b0=0,ys=.12;function wipe(){while(G.children.length){let o=G.children.pop();o.traverse?.(n=>{n.geometry?.dispose?.();n.material?.dispose?.()})}}function cell(w,x,y){x=Math.max(0,Math.min(w.grid.w-1,x));y=Math.max(0,Math.min(w.grid.h-1,y));return w.grid.cells[y*w.grid.w+x]}function Y(q){return((+q?.elevation||0)-b0)*ys}function E(w,x,y){return Y(cell(w,Math.floor(x*w.grid.w),Math.floor(y*w.grid.h)))}function P(w,x,y){return[(x-.5)*(w.grid.w-1)*z,(y-.5)*(w.grid.h-1)*z]}function ground(w){let v=[],co=[],ix=[];for(let y=0;y<w.grid.h;y++)for(let x=0;x<w.grid.w;x++){let q=cell(w,x,y),m=q.soil?.moisture||0,o=q.soil?.organic||0,k=new T.Color().setHSL(.09+o*.035,.34+o*.18,.24+m*.12);v.push((x-(w.grid.w-1)/2)*z,Y(q),(y-(w.grid.h-1)/2)*z);co.push(k.r,k.g,k.b)}for(let y=0;y<w.grid.h-1;y++)for(let x=0;x<w.grid.w-1;x++){let a=y*w.grid.w+x,b=a+1,d=a+w.grid.w,e=d+1;ix.push(a,d,b,b,d,e)}let q=new T.BufferGeometry();q.setAttribute('position',new T.Float32BufferAttribute(v,3));q.setAttribute('color',new T.Float32BufferAttribute(co,3));q.setIndex(ix);q.computeVertexNormals();G.add(new T.Mesh(q,new T.MeshStandardMaterial({vertexColors:true,roughness:.98})))}function plant(w,p){let[x,d]=P(w,p.x,p.y),y=E(w,p.x,p.y),bio=Math.max(.02,p.biomassKg??p.biomass??.02),kind=p.kind||p.species,m=new T.MeshStandardMaterial({color:kind==='grass'?0x39743e:0x315b37,roughness:.9});if(kind==='grass'){let h=.1+Math.min(.45,bio*.7),q=new T.Mesh(new T.ConeGeometry(.025,h,4),m);q.position.set(x,y+h/2,d);G.add(q)}else{let k=.2+Math.min(.9,Math.sqrt(bio)*.25),a=new T.Mesh(new T.CylinderGeometry(.02,.04,.45*k,5),new T.MeshStandardMaterial({color:0x69472e})),q=new T.Mesh(new T.IcosahedronGeometry(.24*k,1),m);a.position.set(x,y+.22*k,d);q.position.set(x,y+.5*k,d);G.add(a,q)}}function person(w,a,col,k=.75){let[x,d]=P(w,a.x,a.y),y=E(w,a.x,a.y),q=new T.Group(),m=new T.MeshStandardMaterial({color:col}),b=new T.Mesh(new T.CapsuleGeometry(.12*k,.38*k,3,5),m),h=new T.Mesh(new T.SphereGeometry(.15*k,8,6),m);b.position.y=.5*k;h.position.y=.96*k;q.add(b,h);q.position.set(x,y,d);G.add(q)}function draw(w){wipe();z=(w.grid.cellMeters||4.5)*.07;b0=Math.min(...w.grid.cells.map(q=>+q.elevation||0));let ir=w.representation,cloud=w.weather?.cloud??.5,solar=w.weather?.solar??0;S.background=new T.Color().setHSL(.55-.03*solar,.28,.17+.3*solar-cloud*.06);S.fog=new T.FogExp2(S.background,.032+cloud*.015);H.intensity=.8+solar*2.5;L.intensity=.3+solar*4;L.position.set(-20,8+solar*30,18);ground(w);for(let p of ir?.entities?.plants||w.plants||[])plant(w,p);for(let a of ir?.entities?.agents||w.agents||[])person(w,a,0xe2d4bc);let at=ir?.entities?.atlas||w.atlas;if(at)person(w,at,0xd39a34,1.05);let gok=w.geo?.anchor?.source==='miambienteMunicipalHead'||w.provenance?.checks?.anati?.ok===true,dem=(w.grid.provenance?.terrainTruth||w.grid.provenance?.terrainStatus)==='open-dem-calibrated',gg=w.physics?.gravityUsed_m_s2||9.80665,a=w.geo?.anchor;cy.textContent=`REALITY · CICLO ${w.cycle}`;ct.textContent=`${w.metrics?.cells||w.grid.cells.length} celdas · ${w.metrics?.plants||0} plantas`;fa.textContent=`${w.grid.cellMeters}m · g ${(+gg).toFixed(6)} · Δagua ${w.metrics?.waterMassResidual_L??'—'}L`;tr.textContent=gok&&dem?'SIR · DEM REAL · GEO VERIFICADA':'SIR · DATOS PARCIALES';geo.textContent=a?`${(+a.lat).toFixed(5)}° N, ${Math.abs(+a.lon).toFixed(5)}° W · ${gok?'oficial':'provisional'}`:'ancla no disponible'}async function sync(){try{draw(await fetch('world-state.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()))}catch{cy.textContent='RECONECTANDO'}}let t=new T.Vector3(0,1.1,0),ya=.72,pi=-.13,di=8.2,drag=0,lx=0,ly=0;function cam(){let p=Math.cos(pi);C.position.set(t.x+Math.sin(ya)*p*di,t.y+Math.sin(-pi)*di,t.z+Math.cos(ya)*p*di);C.lookAt(t)}cam();R.domElement.onpointerdown=e=>{drag=1;lx=e.clientX;ly=e.clientY};onpointerup=()=>drag=0;onpointermove=e=>{if(!drag)return;ya-=(e.clientX-lx)*.006;pi=Math.max(-.48,Math.min(-.05,pi
