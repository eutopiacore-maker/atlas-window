<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#020607"><title>Atlas Window</title><style>
:root{--gold:#efbd68;--glass:rgba(4,9,11,.42);--line:rgba(239,189,104,.22);--text:#f4f1e9;--muted:#aeb3b5}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020607;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.veil{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.02) 55%,rgba(0,0,0,.32));z-index:2}.chrome{position:fixed;inset:0;z-index:4;pointer-events:none}.top{position:absolute;left:15px;right:15px;top:max(13px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:10px}.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 30px rgba(0,0,0,.22)}.logo{padding:10px 12px;border-radius:17px}.logo b{font-size:12px;letter-spacing:.28em}.logo small{display:block;color:var(--gold);font-size:8px;letter-spacing:.35em;margin-top:4px}.live{padding:10px 12px;border-radius:18px;font-size:10px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#6ed77c;box-shadow:0 0 12px #6ed77c;margin-right:7px}.place{position:absolute;left:18px;top:16%;text-shadow:0 2px 16px #000}.place h1{font-size:22px;letter-spacing:.14em;margin:0 0 6px}.place div{font-size:10px;line-height:1.65;letter-spacing:.08em;color:#d8dddd}.quote{position:absolute;right:16px;top:20%;width:40vw;max-width:180px;padding:12px 13px;border-radius:16px;font-size:10px;line-height:1.55}.quote b{display:block;color:var(--gold);font-size:9px;letter-spacing:.13em;margin-bottom:6px}.controls{position:absolute;right:13px;bottom:19%;display:grid;gap:7px;pointer-events:auto}.controls button{width:59px;height:58px;border-radius:15px;border:1px solid rgba(255,255,255,.08);background:rgba(5,10,12,.50);color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:9px}.controls strong{display:block;font-size:17px;margin-bottom:2px}.bottom{position:absolute;left:14px;right:14px;bottom:max(13px,env(safe-area-inset-bottom));display:flex;justify-content:center}.badge{padding:9px 12px;border-radius:999px;font-size:9px;color:var(--muted)}.badge b{color:var(--gold)}.immersive .chrome{opacity:0;pointer-events:none}.chrome{transition:opacity .35s}.hint{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);font-size:9px;letter-spacing:.12em;color:rgba(255,255,255,.68);text-shadow:0 2px 10px #000}.night .veil{background:linear-gradient(180deg,rgba(0,0,20,.12),rgba(0,0,0,.08) 55%,rgba(0,0,0,.43))}@media(max-height:720px){.place{top:14%}.quote{top:18%}.controls{bottom:21%}}
</style></head><body><canvas id="world"></canvas><div class="veil"></div><div class="chrome"><div class="top"><div class="glass logo"><b>ATLAS</b><small>VENTANA</small></div><div class="glass live"><span class="dot"></span><span id="status">MUNDO VIVO</span></div></div><div class="place"><h1>PENONOMÉ</h1><div>COCLÉ, PANAMÁ<br>8.5089° N, 79.6198° W<br><span id="clock">--:--:--</span></div></div><div class="glass quote"><b>ATLAS DICE</b><span id="quote">Observa. Comprende. Protege. Sirve.</span></div><div class="controls"><button id="day"><strong>☀️</strong>DÍA</button><button id="night"><strong>☾</strong>NOCHE</button><button id="imm"><strong>◉</strong>INMERSIVO</button></div><div class="hint">EL MUNDO CONTINÚA AUNQUE NO TOQUES NADA</div><div class="bottom"><div class="glass badge"><b>CORE PRIVADO</b> → GATEWAY → VENTANA</div></div></div><script>
const c=document.getElementById('world'),ctx=c.getContext('2d');let W=0,H=0,D=Math.min(devicePixelRatio||1,2),t=0,last=performance.now(),night=false,immersive=false;const clouds=[],cars=[],birds=[],fireflies=[],trees=[],lights=[];function resize(){W=innerWidth;H=visualViewport?visualViewport.height:innerHeight;c.width=W*D;c.height=H*D;c.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);visualViewport&&visualViewport.addEventListener('resize',resize);resize();
for(let i=0;i<9;i++)clouds.push({x:Math.random(),y:.1+Math.random()*.35,s:.15+Math.random()*.22,v:.004+Math.random()*.007,a:.035+Math.random()*.05});for(let i=0;i<24;i++)cars.push({u:Math.random(),v:.018+Math.random()*.028,side:i%2,phase:Math.random()*8});for(let i=0;i<11;i++)birds.push({x:Math.random(),y:.24+Math.random()*.22,v:.018+Math.random()*.014,p:Math.random()*6.28});for(let i=0;i<42;i++)fireflies.push({x:Math.random(),y:.57+Math.random()*.36,p:Math.random()*6.28});for(let i=0;i<38;i++)trees.push({x:i/37,y:.72+Math.random()*.12,h:25+Math.random()*60,p:Math.random()*6.28});for(let i=0;i<90;i++)lights.push({x:Math.random(),y:.55+Math.random()*.25,p:Math.random()*6.28});
function ridge(base,amp,freq,col,off){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=8){let y=base+(Math.sin(x*freq+off)+.45*Math.sin(x*freq*2.4+off*1.6)+.2*Math.sin(x*freq*5.1))*amp;ctx.lineTo(x,y)}ctx.lineTo(W,H);ctx.closePath();ctx.fill()}
function sky(){let g=ctx.createLinearGradient(0,0,0,H);if(night){g.addColorStop(0,'#02070d');g.addColorStop(.45,'#10222b');g.addColorStop(.72,'#1e2e2d');g.addColorStop(1,'#07100f')}else{g.addColorStop(0,'#061018');g.addColorStop(.38,'#16353a');g.addColorStop(.68,'#4e6456');g.addColorStop(1,'#0b1715')}ctx.fillStyle=g;ctx.fillRect(0,0,W,H);let sx=W*.76,sy=H*(night?.20:.34),r=night?18:36;ctx.fillStyle=night?'rgba(210,224,233,.72)':'rgba(255,215,143,.86)';ctx.beginPath();ctx.arc(sx,sy,r,0,7);ctx.fill();let rg=ctx.createRadialGradient(sx,sy,0,sx,sy,H*.34);rg.addColorStop(0,night?'rgba(150,180,210,.08)':'rgba(255,195,113,.22)');rg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H*.72);if(night){for(let i=0;i<70;i++){let x=(i*91.7)%W,y=(i*47.3)%(H*.45),a=.18+.35*(.5+.5*Math.sin(t*.9+i));ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.fillRect(x,y,1.2,1.2)}}}
function drawClouds(){for(const cl of clouds){cl.x+=cl.v*.016;if(cl.x>1.25)cl.x=-.25;let x=cl.x*W,y=cl.y*H,s=cl.s*W;ctx.fillStyle='rgba(225,232,228,'+(night?cl.a*.35:cl.a)+')';for(let k=0;k<6;k++){let ox=(k-2.5)*s*.11,oy=Math.sin(k*1.7+cl.x*5)*s*.03;ctx.beginPath();ctx.ellipse(x+ox,y+oy,s*.22,s*.07,0,0,7);ctx.fill()}}}
function land(){ridge(H*.49,23,.008,night?'#102124':'#1a3433',t*.001);ridge(H*.57,35,.012,night?'#091819':'#102924',t*.0018+2);ridge(H*.65,47,.016,night?'#061112':'#091c18',t*.0026+4);ctx.fillStyle=night?'#050b0a':'#07120f';ctx.fillRect(0,H*.62,W,H*.38)}
function city(){for(const l of lights){let a=(night?.34:.13)+.18*(.5+.5*Math.sin(t*1.7+l.p));ctx.fillStyle='rgba(244,191,102,'+a+')';ctx.fillRect(l.x*W,l.y*H,1.6,1.6)}ctx.strokeStyle=night?'rgba(245,182,91,.42)':'rgba(225,187,111,.30)';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(W*.56,H*.59);ctx.bezierCurveTo(W*.48,H*.69,W*.65,H*.78,W*.49,H);ctx.stroke();ctx.strokeStyle='rgba(255,226,163,.18)';ctx.lineWidth=1.4;ctx.stroke()}
function traffic(){for(const car of cars){car.u=(car.u+car.v*.016)%1;let u=car.u,y=H*(.60+.39*u),cx=W*(.56+.07*Math.sin(u*5.5)),roadW=W*(.01+.10*u),x=cx+(car.side?1:-1)*roadW*.28;ctx.fillStyle=car.side?'rgba(255,225,160,.8)':'rgba(210,70,55,.72)';let r=1.2+u*2.2;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}}
function vegetation(){let wind=Math.sin(t*.7)*.55+Math.sin(t*.19)*.35;for(const tr of trees){let x=tr.x*W,y=tr.y*H,sway=Math.sin(t*.9+tr.p)*wind*8;ctx.strokeStyle='rgba(6,18,13,.92)';ctx.lineWidth=Math.max(1,tr.h*.045);ctx.beginPath();ctx.moveTo(x,y+tr.h*.3);ctx.quadraticCurveTo(x+sway*.3,y-tr.h*.15,x+sway,y-tr.h*.62);ctx.stroke();ctx.fillStyle='rgba(4,20,13,.94)';ctx.beginPath();ctx.ellipse(x+sway,y-tr.h*.66,tr.h*.20,tr.h*.40,sway*.01,0,7);ctx.fill()}}
function drawBirds(){ctx.strokeStyle='rgba(225,230,226,.34)';ctx.lineWidth=1;for(const b of birds){b.x+=b.v*.016;if(b.x>1.08)b.x=-.08;let x=b.x*W,y=b.y*H+Math.sin(t*1.2+b.p)*8,s=4+3*Math.sin(b.p);ctx.beginPath();ctx.moveTo(x-s,y);ctx.quadraticCurveTo(x,y-s*.55,x+s,y);ctx.stroke()}}
function drawFireflies(){for(const f of fireflies){let x=f.x*W+Math.sin(t*.5+f.p)*14,y=f.y*H+Math.sin(t*1.1+f.p)*7,a=(night?.25:.08)+.30*(.5+.5*Math.sin(t*2.4+f.p));ctx.fillStyle='rgba(238,204,113,'+a+')';ctx.beginPath();ctx.arc(x,y,1.2,0,7);ctx.fill()}}
function atlas(){let cx=W*(.52+.13*Math.sin(t*.11)),cy=H*(.43+.03*Math.sin(t*.17));ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<74;i++){let a=i/74*6.283+t*.09,r=28+i*.9+Math.sin(t*.7+i)*8,x=cx+Math.cos(a)*r*1.55,y=cy+Math.sin(a)*r*.52,al=.02+.07*(.5+.5*Math.sin(t*1.6+i));ctx.fillStyle='rgba(168,211,231,'+al+')';ctx.beginPath();ctx.arc(x,y,1.3,0,7);ctx.fill()}let g=ctx.createRadialGradient(cx,cy,0,cx,cy,100);g.addColorStop(0,'rgba(255,213,130,.12)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,100,0,7);ctx.fill();ctx.strokeStyle='rgba(181,219,235,.13)';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(cx,cy+5,58,24,-.12,0,7);ctx.arc(cx+54,cy-12,15,0,7);ctx.moveTo(cx+65,cy-12);ctx.lineTo(cx+78,cy-6);ctx.stroke();ctx.restore()}
function render(n){let dt=Math.min(.033,(n-last)/1000);last=n;t+=dt;sky();drawClouds();drawBirds();land();city();traffic();vegetation();drawFireflies();atlas();let v=ctx.createRadialGradient(W*.5,H*.5,Math.min(W,H)*.18,W*.5,H*.5,Math.max(W,H)*.7);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.44)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);requestAnimationFrame(render)}requestAnimationFrame(render);
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('es-PA',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),1000);document.getElementById('day').onclick=()=>{night=false;document.body.classList.remove('night');document.getElementById('status').textContent='MUNDO VIVO · DÍA'};document.getElementById('night').onclick=()=>{night=true;document.body.classList.add('night');document.getElementById('status').textContent='MUNDO VIVO · NOCHE'};document.getElementById('imm').onclick=()=>{immersive=!immersive;document.body.classList.toggle('immersive',immersive)};document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
</script></body></html>
