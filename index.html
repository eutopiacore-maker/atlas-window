<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#030708">
<title>Atlas Window</title>
<style>
:root{--gold:#efbd68;--glass:rgba(5,10,12,.56);--line:rgba(239,189,104,.22);--text:#f4f1e9;--muted:#aeb3b5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030708;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}button{font:inherit;color:inherit}.world{position:fixed;inset:0;background:#030708 center/cover no-repeat;transition:filter .45s,transform .6s}.world:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(1,5,7,.12),rgba(1,5,7,.03) 55%,rgba(1,5,7,.42))}.night .world{filter:brightness(.58) saturate(.8) hue-rotate(8deg)}.immersive .chrome{opacity:0;pointer-events:none}.chrome{transition:opacity .35s}.top{position:fixed;left:16px;right:16px;top:max(14px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;z-index:5}.logo{font-weight:800;letter-spacing:.28em;font-size:13px;text-shadow:0 2px 14px #000}.logo span{display:block;font-size:8px;letter-spacing:.35em;color:var(--gold);margin-top:3px}.live{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-radius:18px;padding:10px 12px;font-size:11px;box-shadow:0 12px 30px rgba(0,0,0,.28)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#70d776;box-shadow:0 0 10px #70d776;margin-right:7px}.place{position:fixed;z-index:5;left:18px;top:15%;text-shadow:0 2px 15px #000}.place h1{font-size:24px;letter-spacing:.14em;margin:0 0 7px}.place div{font-size:11px;letter-spacing:.08em;line-height:1.7;color:#d7d9d9}.quote{position:fixed;z-index:5;right:16px;top:19%;width:42vw;max-width:190px;padding:13px;background:var(--glass);border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:17px;font-size:11px;line-height:1.55}.quote b{display:block;color:var(--gold);font-size:9px;letter-spacing:.12em;margin-bottom:7px}.menu{position:fixed;z-index:6;left:14px;bottom:22%;display:grid;gap:5px}.menu button,.side button,.nav button{background:var(--glass);border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:12px;box-shadow:0 9px 24px rgba(0,0,0,.22)}.menu button{width:132px;text-align:left;padding:10px 12px;font-size:10px;letter-spacing:.08em}.menu button.active{border-color:var(--line);color:var(--gold)}.side{position:fixed;z-index:6;right:14px;bottom:27%;display:grid;gap:7px}.side button{width:58px;height:58px;font-size:9px;padding:4px}.side button strong{display:block;font-size:18px;margin-bottom:3px}.panel{position:fixed;z-index:8;left:14px;right:14px;bottom:calc(88px + env(safe-area-inset-bottom));padding:14px;background:rgba(7,10,11,.76);border:1px solid var(--line);border-radius:23px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 44px rgba(0,0,0,.36);transform:translateY(calc(100% + 110px));transition:transform .35s}.panel.open{transform:translateY(0)}.panel h2{margin:0 0 3px;font-size:15px}.panel small{color:var(--gold);letter-spacing:.1em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.card{padding:11px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.05)}.card b{font-size:24px;display:block;margin-top:4px}.card span{font-size:9px;color:var(--muted)}.nav{position:fixed;z-index:9;left:14px;right:14px;bottom:max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.nav button{height:60px;font-size:9px}.nav button strong{display:block;font-size:17px;margin-bottom:2px}.nav button.active{color:var(--gold);border-color:var(--line)}.toast{position:fixed;z-index:20;left:50%;top:10%;transform:translate(-50%,-20px);opacity:0;background:rgba(3,8,10,.85);border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:10px;transition:.25s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.veil{position:fixed;z-index:4;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 25%,rgba(0,0,0,.18) 100%)}
@media(max-height:720px){.place{top:13%}.quote{top:16%}.menu{bottom:24%}.side{bottom:30%}.menu button{padding:8px 10px}}
</style>
</head>
<body>
<div class="world" id="world"></div><div class="veil"></div>
<div class="chrome" id="chrome">
<div class="top"><div class="logo">ATLAS<span>VENTANA</span></div><div class="live"><span class="dot"></span><span id="liveText">SIMULACIÓN ACTIVA</span></div></div>
<div class="place"><h1>PENONOMÉ</h1><div>COCLÉ, PANAMÁ<br>8.5089° N, 79.6198° W<br><span id="clock">--:--:--</span></div></div>
<div class="quote"><b>ATLAS DICE</b><span id="quote">Observa. Comprende. Optimiza. Protege. Sirve.</span></div>
<div class="menu">
<button class="active" data-view="actual">◉ VISTA ACTUAL</button>
<button data-view="regional">⌖ MAPA REGIONAL</button>
<button data-view="projects">▦ PROYECTOS</button>
<button data-view="indicators">▥ INDICADORES</button>
<button data-view="resources">◇ RECURSOS</button>
<button data-view="connect">◎ CONECTAR</button>
<button data-view="sim">⬡ SIMULADOR</button>
</div>
<div class="side">
<button id="day"><strong>☀</strong>DÍA</button>
<button id="night"><strong>☾</strong>NOCHE</button>
<button id="layers"><strong>▱</strong>CAPAS</button>
<button id="immersive"><strong>⌗</strong>INMERSIVO</button>
</div>
<div class="panel" id="panel"><small>FOCO ACTIVO</small><h2 id="panelTitle">Desarrollo integral de Penonomé</h2><div class="grid" id="cards"></div></div>
<div class="nav"><button class="active"><strong>⌂</strong>INICIO</button><button id="messages"><strong>◌</strong>MENSAJES</button><button id="alerts"><strong>△</strong>ALERTAS</button><button id="profile"><strong>○</strong>PERFIL</button></div>
</div>
<div class="toast" id="toast"></div>
<script>
const world=document.getElementById('world'),toast=document.getElementById('toast'),panel=document.getElementById('panel'),cards=document.getElementById('cards'),panelTitle=document.getElementById('panelTitle');
fetch('atlas-bg.txt').then(r=>r.text()).then(b=>world.style.backgroundImage=`url(data:image/webp;base64,${b.trim()})`).catch(()=>{});
function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>toast.classList.remove('show'),1900)}
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('es-PA',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),1000);
const datasets={
actual:[['AMBIENTE','82%','salud ecosistémica'],['SOCIAL','67%','bienestar comunitario'],['ECONOMÍA','71%','dinamismo económico'],['GOBERNANZA','75%','coordinación institucional']],
regional:[['CONECTIVIDAD','74%','integración territorial'],['MOVILIDAD','69%','acceso y tiempos'],['SERVICIOS','77%','cobertura estratégica'],['RESILIENCIA','81%','capacidad territorial']],
projects:[['ACTIVOS','12','iniciativas visibles'],['PRIORIDAD','4','alto impacto'],['BLOQUEOS','3','requieren coordinación'],['LISTOS','5','para ejecución']],
indicators:[['AMBIENTE','82%','tendencia estable'],['SOCIAL','67%','requiere atención'],['ECONOMÍA','71%','crecimiento moderado'],['GOBERNANZA','75%','mejora potencial']],
resources:[['AGUA','88%','capacidad relativa'],['SUELO','73%','aptitud estimada'],['ENERGÍA','64%','margen de mejora'],['TALENTO','79%','capital humano']],
connect:[['ENTIDADES','9','fuentes relacionadas'],['COMUNIDAD','6','nodos sociales'],['EMPRESAS','11','actores económicos'],['ALIANZAS','5','rutas posibles']],
sim:[['ESCENARIOS','3','comparación activa'],['HORIZONTE','24m','ventana simulada'],['RIESGO','MEDIO','según supuestos'],['IMPACTO','ALTO','si se coordina']]
};
const titles={actual:'Desarrollo integral de Penonomé',regional:'Mapa regional de relaciones',projects:'Proyectos y cuellos de botella',indicators:'Indicadores territoriales',resources:'Recursos estratégicos',connect:'Red de actores',sim:'Simulación de escenarios'};
function openView(k){document.querySelectorAll('.menu button').forEach(b=>b.classList.toggle('active',b.dataset.view===k));panelTitle.textContent=titles[k];cards.innerHTML=datasets[k].map(([a,b,c])=>`<div class="card"><span>${a}</span><b>${b}</b><span>${c}</span></div>`).join('');panel.classList.add('open');if(k==='sim')document.getElementById('quote').textContent='Esto no predice el futuro: compara consecuencias bajo supuestos explícitos.'}
document.querySelectorAll('.menu button').forEach(b=>b.onclick=()=>openView(b.dataset.view));openView('actual');
document.getElementById('day').onclick=()=>{document.body.classList.remove('night');say('Vista diurna')};document.getElementById('night').onclick=()=>{document.body.classList.add('night');say('Vista nocturna')};document.getElementById('layers').onclick=()=>{panel.classList.toggle('open');say(panel.classList.contains('open')?'Capas visibles':'Capas ocultas')};document.getElementById('immersive').onclick=()=>{document.body.classList.add('immersive');say('Toca la pantalla para volver');setTimeout(()=>document.body.onclick=()=>{document.body.classList.remove('immersive');document.body.onclick=null},300)};
document.getElementById('messages').onclick=()=>say('Mensajes: modo de solo lectura');document.getElementById('alerts').onclick=()=>say('Sin alertas críticas');document.getElementById('profile').onclick=()=>say('Perfil visitante · sin acceso al Core');
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
</script>
</body>
</html>
