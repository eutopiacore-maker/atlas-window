<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#07100d"><title>Atlas Window</title><style>:root{--g:#efbd68;--glass:rgba(5,10,10,.38);--line:rgba(239,189,104,.22);--t:#f7f4ed;--m:#b7bdbe}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100d;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}.shade{position:fixed;inset:0;z-index:3;background:linear-gradient(180deg,rgba(0,4,6,.12),transparent 50%,rgba(0,4,6,.34));pointer-events:none}.hud{position:fixed;inset:0;z-index:5;padding:max(15px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));pointer-events:none}.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-radius:18px;box-shadow:0 12px 36px rgba(0,0,0,.22)}.top{display:flex;justify-content:space-between}.brand,.live{padding:10px 12px}.brand b{letter-spacing:.27em;font-size:12px}.brand small{display:block;margin-top:4px;color:var(--g);letter-spacing:.28em;font-size:8px}.live{font-size:10px;line-height:1.55;text-align:right}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#70d776;box-shadow:0 0 11px #70d776;margin-right:6px}.place{position:absolute;left:18px;top:15%;text-shadow:0 2px 16px #000}.place h1{font-size:24px;letter-spacing:.13em;margin:0 0 6px}.place div{font-size:10px;line-height:1.7}.atlas{position:absolute;right:16px;top:19%;width:min(210px,44vw);padding:12px}.atlas b,.status b{color:var(--g);font-size:9px;letter-spacing:.11em}.atlas div{font-size:10px;line-height:1.55;margin-top:6px}.status{position:absolute;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));padding:11px 13px;display:flex;justify-content:space-between;gap:12px}.status span{font-size:9px;color:var(--m);text-align:right}</style></head><body><div class="shade"></div><div class="hud"><div class="top"><div class="glass brand"><b>ATLAS</b><small>VENTANA</small></div><div class="glass live"><div><span class="dot"></span><span id="worldState">MUNDO CAUSAL</span></div><div id="sourceState">leyendo estado…</div></div></div><div class="place"><h1>PENONOMÉ</h1><div>COCLÉ, PANAMÁ<br>8.51208° N, 80.35468° W</div></div><div class="glass atlas"><b>ATLAS</b><div id="atlasLine">observando la red causal</div></div><div class="glass status"><b>PA.COCLE.PENONOME</b><span id="facts">cargando mundo…</span></div></div><script type="module">import * as T from 'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';const s=new T.Scene(),c=new T.PerspectiveCamera(52,innerWidth/innerHeight,.1,300),r=new T.WebGLRenderer({antialias:true}),g=new T.Group(),hemi=new T.HemisphereLight(0xffefd4,0x253326,2),sun=new T.DirectionalLight(0xffc878,3.4);r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio||1,1.5));r.shadowMap.enabled=true;r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.08;document.body.prepend(r.domElement);Object.assign(r.domElement.style,{position:'fixed',inset:'0',zIndex:'2',touchAction:'none'});sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);s.add(hemi,sun,g);const Z=1.25;function wipe(){while(g.children.length){const o=g.children.pop();o.traverse?.(n=>{n.geometry?.dispose?.();n.material?.dispose?.()})}}function cell(w,x,y){x=Math.max(0,Math.min(w.grid.w-1,x));y=Math.max(0,Math.min(w.grid.h-1,y));return w.grid.cells[y*w.grid.w+x]}function H(w,x,y){return(cell(w,Math.floor(x*w.grid.w),Math.floor(y*w.grid.h))?.elevation||0)*4}function P(w,x,y){return[(x-.5)*(w.grid.w-1)*Z,(y-.5)*(w.grid.h-1)*Z]}function terrain(w){const v=[],co=[],ix=[];for(let y=0;y<w.grid.h;y++)for(let x=0;x<w.grid.w;x++){const q=cell(w,x,y),m=q.soil?.moisture||0,o=q.soil?.organic||0,col=new T.Color().setHSL(.09+o*.04,.32+o*.18,.22+m*.13);v.push((x-(w.grid.w-1)/2)*Z,(q.elevation||0)*4,(y-(w.grid.h-1)/2)*Z);co.push(col.r,col.g,col.b)}for(let y=0;y<w.grid.h-1;y++)for(let x=0;x<w.grid.w-1;x++){const a=y*w.grid.w+x,b=a+1,d=a+w.grid.w,e=d+1;ix.push(a,d,b,b,d,e)}const q=new T.BufferGeometry();q.setAttribute('position',new T.Float32BufferAttribute(v,3));q.setAttribute('color',new T.Float32BufferAttribute(co,3));q.setIndex(ix);q.computeVertexNormals();const m=new T.Mesh(q,new T.MeshStandardMaterial({vertexColors:true,roughness:.98}));m.receiveShadow=true;g.add(m)}function plant(w,p){const[x,z]=P(w,p.x,p.y),y=H(w,p.x,p.y),b=Math.max(.02,p.biomass||.02),ok=Math.max(.15,p.health??.5);if(p.species==='grass'){const hh=.12+Math.min(.65,b*.8),q=new T.Mesh(new T.ConeGeometry(.03,hh,4),new T.MeshStandardMaterial({color:new T.Color().setHSL(.28,.55,.18+.24*ok)}));q.position.set(x,y+hh/2,z);g.add(q)}else{const k=.2+Math.min(1.2,Math.sqrt(b)*.4),tr=new T.Mesh(new T.CylinderGeometry(.04*k,.07*k,.6*k,6),new T.MeshStandardMaterial({color:0x63472e})),cr=new T.Mesh(new T.IcosahedronGeometry(.3*k,1),new T.MeshStandardMaterial({color:new T.Color().setHSL(.3,.5,.18+.2*ok)}));tr.position.set(x,y+.3*k,z);cr.position.set(x,y+.72*k,z);g.add(tr,cr)}}function person(w,a,col,k=.8){const[x,z]=P(w,a.x,a.y),y=H(w,a.x,a.y),q=new T.Group(),m=new T.MeshStandardMaterial({color:col}),b=new T.Mesh(new T.CapsuleGeometry(.13*k,.42*k,3,5),hd=new T.Mesh(new T.SphereGeometry(.16*k,8,6),m);b.material=m;b.position.y=.55*k;hd.position.y=1.03*k;q.add(b,hd);q.position.set(x,y+.04,z);g.add(q);return q}function draw(w){wipe();if(!w.grid)return;const cl=w.weather?.cloud??.5,so=w.weather?.solar??0;s.background=new T.Color().setHSL(.55-.03*so,.28,.17+.3*so-cl*.06);s.fog=new T.FogExp2(s.background,.014+cl*.01);hemi.intensity=.8+so*2.5;sun.intensity=.3+so*4;sun.position.set(-20,8+so*30,18);terrain(w);const wm=new T.MeshPhysicalMaterial({color:0x3b8296,roughness:.15,transparent:true,opacity:.62});for(const q of w.grid.cells)if((q.waterMm||0)>.12){const nx=q.x/(w.grid.w-1),ny=q.y/(w.grid.h-1),[x,z]=P(w,nx,ny),a=new T.Mesh(new T.CircleGeometry(Z*.46,10),wm);a.rotation.x=-Math.PI/2;a.position.set(x,H(w,nx,ny)+.03,z);g.add(a)}for(const p of w.plants||[])plant(w,p);for(const a of w.agents||[])person(w,a,0xe2d4bc);if(w.atlas){const a=person(w,w.atlas,0xd39a34,1.1),l=new T.PointLight(0xf0b54b,2,5);l.position.y=1.4;a.add(l)}document.getElementById('worldState').textContent=`CAUSAL · CICLO ${w.cycle}`;document.getElementById('sourceState').textContent=`${w.metrics?.plants||0} plantas · ${w.weather?.rainMm||0} mm lluvia`;document.getElementById('atlasLine').textContent=`${w.atlas?.attention||'observando'} · ${w.atlas?.intent||'red causal'}`;document.getElementById('facts').textContent=`semillas ${w.metrics?.seeds||0} · humedad ${Math.round((w.metrics?.meanSoilMoisture||0)*100)}% · agua ${w.metrics?.surfaceWaterMm||0} mm`}async function sync(){try{draw(await fetch('world-state.json?'+Date.now(),{cache:'no-store'}).then(x=>x.json()))}catch(e){document.getElementById('worldState').textContent='RECONECTANDO'}}let tar=new T.Vector3(0,1.5,0),yaw=.72,pit=-.24,d=18,drag=false,lx=0,ly=0;function cam(){const cp=Math.cos(pit);c.position.set(tar.x+Math.sin(yaw)*cp*d,tar.y+Math.sin(-pit)*d,tar.z+Math.cos(yaw)*cp*d);c.lookAt(tar)}cam();r.domElement.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY};onpointerup=()=>drag=false;onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-lx)*.006;pit=Math.max(-1.05,Math.min(-.03,pit-(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY;cam()};let pn=0;r.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){const x=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pn)d=Math.max(4,Math.min(70,d-(x-pn)*.18));pn=x;cam()}},{passive:true});r.domElement.addEventListener('touchend',()=>pn=0,{passive:true});sync();setInterval(sync,15000);(function loop(){requestAnimationFrame(loop);r.render(s,c)})();addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
