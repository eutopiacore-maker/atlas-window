<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Atlas Reality Stack</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100d;color:#f7f4ed;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}#view,#photo{position:fixed;inset:0;width:100%;height:100%;border:0}#view{z-index:1;background:#07100d}#photo{z-index:2;display:none;background:center/cover no-repeat #07100d}#hud{position:fixed;inset:0;z-index:5;pointer-events:none;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));text-shadow:0 2px 12px #000}.glass{background:#07100db8;border:1px solid #efbd6860;backdrop-filter:blur(14px);border-radius:16px}.brand{position:absolute;left:16px;top:max(16px,env(safe-area-inset-top));padding:12px 15px;letter-spacing:.2em;font-size:12px}.brand strong{color:#efbd68}.place{position:absolute;left:18px;top:115px}.place b{font-size:28px;letter-spacing:.09em}.place div{font-size:11px;margin-top:6px}.mode{position:absolute;top:max(20px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto;white-space:nowrap}.mode button{border:1px solid #efbd6860;background:#07100dd9;color:#eee;border-radius:16px;padding:9px 12px;font:10px -apple-system,sans-serif;letter-spacing:.05em}.mode button.on{border-color:#efbd68;color:#efbd68}.mode button.omega{border-color:#8fbcff66}.mode button.omega.on{border-color:#8fbcff;color:#b9d5ff}.status{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top));padding:11px 14px;text-align:right;line-height:1.55}.bottom{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:10px 14px;display:flex;justify-content:space-between;gap:10px;font-size:10px}.bottom span:last-child{text-align:right;color:#c9cfcc}.badge{position:absolute;right:16px;top:115px;padding:9px 12px;font-size:10px;line-height:1.45;display:none}.badge strong{color:#efbd68}@media(max-width:760px){.mode{top:100px;gap:4px}.mode button{padding:7px;font-size:8px}.place{top:158px}.place b{font-size:23px}.status{font-size:10px}.brand{font-size:10px}.bottom{font-size:9px}.badge{top:158px}}
</style>
<iframe id="view" src="world.html?layer=1&embedded=1"></iframe><div id="photo"></div>
<div id="hud"><div class="glass brand"><strong>ATLAS</strong><br>REALITY STACK</div><div class="place"><b>PENONOMÉ</b><div id="geo">conectando geografía…</div></div><div class="mode"><button id="b1">CAPA 1 · ESTADO</button><button id="b2">CAPA 2 · DINÁMICA</button><button id="b3">CAPA 3 · APARIENCIA</button><button id="bo" class="omega">Ω</button></div><div class="glass status"><b id="st">REALITY</b><br><span id="stats">conectando mundo…</span></div><div id="decoder" class="glass badge"><strong>CAPA 3</strong><br><span id="decstate">renderer pendiente</span></div><div class="glass bottom"><span id="truth">SIR · VERIFICANDO</span><span id="detail">leyendo realidad…</span></div></div>
<script type="module">
import{buildAppearanceScenePacket}from'./appearance-scene.js';import{AtlasLocalRenderer}from'./local-render.js';
const $=id=>document.getElementById(id),V=$('view'),P=$('photo'),D=$('decoder'),B1=$('b1'),B2=$('b2'),B3=$('b3'),BO=$('bo'),ST=$('st'),STATS=$('stats'),GEO=$('geo'),TRUTH=$('truth'),DETAIL=$('detail'),DEC=$('decstate'),LR=new AtlasLocalRenderer();
let state=null,packet=null;const params=new URLSearchParams(location.search);let layer=Math.max(1,Math.min(3,+params.get('layer')||1)),omega=params.get('omega')==='1';
function buttons(){B1.classList.toggle('on',layer===1&&!omega);B2.classList.toggle('on',layer===2&&!omega);B3.classList.toggle('on',layer===3&&!omega);BO.classList.toggle('on',omega)}
function setUrl(){const q=new URLSearchParams({layer:String(layer)});if(omega)q.set('omega','1');history.replaceState(null,'',`${location.pathname}?${q}`)}
function showIframe(src){LR.hide();P.style.display='none';D.style.display='none';V.style.display='block';const u=new URL(src,location.href).href;if(V.src!==u)V.src=u}
function setLayer(n){layer=n;omega=false;buttons();setUrl();render()}
function setOmega(){omega=!omega;buttons();setUrl();render()}
B1.addEventListener('click',()=>setLayer(1));B2.addEventListener('click',()=>setLayer(2));B3.addEventListener('click',()=>setLayer(3));BO.addEventListener('click',setOmega);
function cameraPacket(){return{fov:58,height_m:1.65,yaw_deg:null,pitch_deg:null,position:null}}
async function appearance(){if(!state||layer!==3||omega)return;packet=buildAppearanceScenePacket(state,cameraPacket());window.__ATLAS_SCENE_PACKET__=packet;try{if(window.AtlasPhotorealDecoder?.render){const frame=await window.AtlasPhotorealDecoder.render(packet);if(frame){LR.hide();P.style.backgroundImage=`url(${JSON.stringify(frame)})`;P.style.display='block';V.style.display='none';D.style.display='block';DEC.textContent='FOTOGRÁFICO LIVE · decoder';TRUTH.textContent='ESTADO + DINÁMICA → FRAME FOTOGRÁFICO';DETAIL.textContent='causalidad intacta';return}}}catch(e){console.warn('photoreal decoder',e)}try{P.style.display='none';V.style.display='none';const r=LR.render(packet);D.style.display='block';DEC.textContent=`COMPOSITOR LOCAL · ${r.capability.webgl2?'WebGL2':'Canvas2D'}${r.capability.wasm?' + WASM':''}`;TRUTH.textContent='CAPA 3 · RE-RENDER DESDE ESTADO + DINÁMICA';DETAIL.textContent=`${r.dirtyTiles.length} regiones cambiaron · local · pre-fotográfico`}catch(e){showIframe('dynamics.html?embedded=1');D.style.display='block';DEC.textContent='LOCAL RENDER FALLÓ';TRUTH.textContent='CAPA 3 · FALLBACK A DINÁMICA';DETAIL.textContent=String(e?.message||e)}}
function hud(){if(!state)return;const a=state.geo?.anchor,g=state.physics?.gravityUsed_m_s2||state.physicsConstants?.values?.WGS84NormalGravityAtAnchor_m_s2||9.80665;GEO.textContent=a?`${(+a.lat).toFixed(5)}° N, ${Math.abs(+a.lon).toFixed(5)}° W · ${a.source==='miambienteMunicipalHead'||state.provenance?.checks?.anati?.ok?'oficial':'provisional'}`:'ancla pendiente';if(omega){ST.textContent='MODO Ω · SALIDA BINOCULAR';STATS.textContent='L/R simultáneo · fuente causal';TRUTH.textContent='Ω · MODO DE SALIDA';DETAIL.textContent='no es una capa del mundo';return}if(layer===1){ST.textContent=`CAPA 1 · ESTADO · CICLO ${state.cycle}`;STATS.textContent=`${state.metrics?.cells||state.grid?.cells?.length||0} celdas · ${state.metrics?.population||state.agents?.length||0} entidades`;TRUTH.textContent='QUÉ EXISTE · DÓNDE · EN QUÉ ESTADO';DETAIL.textContent=`${state.grid?.cellMeters||'?'}m · g ${(+g).toFixed(6)} · Δagua ${state.metrics?.waterMassResidual_L??'—'}L`}else if(layer===2){ST.textContent=`CAPA 2 · DINÁMICA · CICLO ${state.cycle}`;STATS.textContent='personajes · movimiento · interacción';TRUTH.textContent='QUÉ ESTÁ PASANDO · CÓMO SE MUEVE';DETAIL.textContent='animación sobre estado confirmado'}else{ST.textContent=`CAPA 3 · APARIENCIA · CICLO ${state.cycle}`;STATS.textContent='compositor local separado · objetivo fotográfico'}}
function render(){buttons();hud();if(omega){showIframe('world.html?layer=3&embedded=1');return}if(layer===1)showIframe('world.html?layer=1&embedded=1');else if(layer===2)showIframe('dynamics.html?embedded=1');else appearance()}
async function sync(){try{const r=await fetch(`world-state.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);state=await r.json();render()}catch(e){console.error(e);ST.textContent='RECONNECTANDO';STATS.textContent=String(e?.message||e);TRUTH.textContent='SIR · ERROR DE LECTURA';DETAIL.textContent='reintentando estado causal'}}
buttons();sync();setInterval(sync,15000);
</script>
