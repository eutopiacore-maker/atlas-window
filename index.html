<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050807">
<title>Atlas</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050807;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}#view{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050807}.layers{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:6px;padding:6px;border:1px solid #ffffff0e;border-radius:22px;background:#07100dcc;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 40px #0006}button{appearance:none;-webkit-appearance:none;border:1px solid transparent;background:#0b1512b8;color:#aeb7b1;border-radius:16px;padding:9px 14px;font:600 10px -apple-system,sans-serif;letter-spacing:.11em;white-space:nowrap}button.on{border-color:#efbd6866;color:#efbd68;background:#111a16f0}@media(max-width:560px){button{padding:9px 10px;font-size:9px}.layers{gap:3px;max-width:calc(100vw - 18px)}}
</style>
<iframe id="view" src="field.html?embedded=1"></iframe>
<div class="layers"><button id="b0" class="on">FIELD</button><button id="b1">WORLD</button><button id="b2">DYNAMICS</button><button id="b3">APPEARANCE</button></div>
<script>
(function(){var v=document.getElementById('view'),bs=[document.getElementById('b0'),document.getElementById('b1'),document.getElementById('b2'),document.getElementById('b3')],files=['field.html?embedded=1','world.html?embedded=1','dynamics.html?embedded=1','appearance.html?embedded=1'],keys=['field','world','dynamics','appearance'];function go(n){for(var i=0;i<bs.length;i++)bs[i].classList.toggle('on',i===n);v.src=files[n]+'&v='+Date.now();try{history.replaceState(null,'','?view='+keys[n])}catch(e){}}for(let i=0;i<bs.length;i++)bs[i].onclick=function(){go(i)};var q=new URLSearchParams(location.search),wanted=(q.get('view')||'field').toLowerCase(),n=Math.max(0,keys.indexOf(wanted));go(n)})();
</script>
