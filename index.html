<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Atlas Reality Stack</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100d;color:#f7f4ed;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}#world,#photo{position:fixed;inset:0;width:100%;height:100%;border:0}#world{z-index:1;background:#07100d}#photo{z-index:2;display:none;background:center/cover no-repeat url('appearance/reference/penonome-v1.jpg')}#photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0005 0%,transparent 25%,transparent 70%,#0007 100%)}#hud{position:fixed;inset:0;z-index:5;pointer-events:none;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));text-shadow:0 2px 12px #000}.glass{background:#07100db8;border:1px solid #efbd6860;backdrop-filter:blur(14px);border-radius:16px}.brand{position:absolute;left:16px;top:max(16px,env(safe-area-inset-top));padding:12px 15px;letter-spacing:.2em;font-size:12px}.brand strong{color:#efbd68}.place{position:absolute;left:18px;top:115px}.place b{font-size:28px;letter-spacing:.09em}.place div{font-size:11px;margin-top:6px}.mode{position:absolute;top:max(20px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}.mode button{border:1px solid #efbd6860;background:#07100dd9;color:#eee;border-radius:16px;padding:10px 14px;font:11px -apple-system,sans-serif;letter-spacing:.07em;white-space:nowrap}.mode button.on{border-color:#efbd68;color:#efbd68}.status{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top));padding:11px 14px;text-align:right;line-height:1.55}.bottom{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:10px 14px;display:flex;justify-content:space-between;gap:10px;font-size:10px}.bottom span:last-child{text-align:right;color:#c9cfcc}.badge{position:absolute;right:16px;top:115px;padding:9px 12px;font-size:10px;line-height:1.45;display:none}.badge strong{color:#efbd68}@media(max-width:760px){.mode{top:100px}.mode button{padding:8px 9px;font-size:9px}.place{top:158px}.place b{font-size:23px}.status{font-size:10px}.brand{font-size:10px}.bottom{font-size:9px}.badge{top:158px}}</style><iframe id="world" src="world.html?layer=1"></iframe><div id="photo"></div><div id="hud"><div class="glass brand"><strong>ATLAS</strong><br>REALITY STACK</div><div class="place"><b>PENONOMÉ</b><div id="geo">conectando geografía…</div></div><div class="mode"><button id="b1">CAPA 1</button><button id="b2">CAPA 2 · APARIENCIA</button><button id="b3">CAPA 3 · Ω</button></div><div class="glass status"><b id="st">REALITY</b><br><span id="stats">conectando mundo…</span></div><div id="decoder" class="glass badge"><strong>CAPA 2 FOTOGRÁFICA</strong><br><span id="decstate">decoder local</span></div><div class="glass bottom"><span id="truth">SIR · VERIFICANDO</span><span id="detail">leyendo realidad…</span></div></div><script type="module">import{buildAppearanceScenePacket}from'./appearance-scene.js';const W=document.getElementById('world'),P=document.getElementById('photo'),D=document.getElementById('decoder');let state=null,layer=Math.max(1,Math.min(3,+new URLSearchParams(location.search).get('layer')||1)),packet=null;function buttons(){b1.classList.toggle('on',layer===1);b2.classList.toggle('on',layer===2);b3.classList.toggle('on',layer===3)}function hideChildHud(){try{const d=W.contentDocument;for(const id of['hud']){const e=d?.getElementById(id);if(e)e.style.display='none'}}catch{}}function setLayer(n){layer=n;buttons();history.replaceState(0,'',`${location.pathname}?layer=${n}`);if(n===2){W.style.display='none';P.style.display='block';D.style.display='block';renderAppearance()}else{P.style.display='none';D.style.display='none';W.style.display='block';const want=`world.html?layer=${n}`;if(!W.src.endsWith(want))W.src=want;else hideChildHud()}hud()}b1.onclick=()=>setLayer(1);b2.onclick=()=>setLayer(2);b3.onclick=()=>setLayer(3);W.onload=()=>hideChildHud();function cameraPacket(){return{fov:58,height_m:1.65,yaw_deg:null,pitch_deg:null,position:null}}async function renderAppearance(){if(!state)return;packet=buildAppearanceScenePacket(state,cameraPacket());window.__ATLAS_SCENE_PACKET__=packet;let live=false;try{if(window.AtlasPhotorealDecoder?.render){const frame=await window.AtlasPhotorealDecoder.render(packet);if(frame){P.style.backgroundImage=`url(${JSON.stringify(frame)})`;live=true}}}catch{}if(!live)P.style.backgroundImage="url('appearance/reference/penonome-v1.jpg')";decstate.textContent=live?'DECODER LIVE · escena derivada del SIR':'KEYFRAME LOCAL · decoder live offline';truth.textContent=live?'SIR → DECODER FOTOGRÁFICO LIVE':'SIR → SCENE PACKET · REFERENCIA FOTOGRÁFICA';detail.textContent=live?'apariencia inferida · causalidad intacta':'asset local integrado · no es inferencia live'}function hud(){if(!state)return;const a=state.geo?.anchor,g=state.physics?.gravityUsed_m_s2||state.physicsConstants?.values?.WGS84NormalGravityAtAnchor_m_s2||9.80665;geo.textContent=a?`${(+a.lat).toFixed(5)}° N, ${Math.abs(+a.lon).toFixed(5)}° W · ${a.source==='miambienteMunicipalHead'||state.provenance?.checks?.anati?.ok?'oficial':'provisional'}`:'ancla pendiente';if(layer===1){st.textContent=`CAPA 1 · REALIDAD · CICLO ${state.cycle}`;stats.textContent=`${state.metrics?.cells||state.grid?.cells?.length||0} celdas · ${state.metrics?.plants||0} plantas`;truth.textContent='SIR · REALIDAD CAUSAL';detail.textContent=`${state.grid?.cellMeters||'?'}m · g ${(+g).toFixed(6)} · Δagua ${state.metrics?.waterMassResidual_L??'—'}L`}else if(layer===2){st.textContent=`CAPA 2 · APARIENCIA · CICLO ${state.cycle}`;stats.textContent=`${state.metrics?.population||0} entidades humanas/Atlas · ${state.metrics?.plants||0} plantas`;renderAppearance()}else{st.textContent='CAPA 3 · Ω BINOCULAR';stats.textContent='L/R simultáneo · transporte estereoscópico';truth.textContent='Ω · PROYECCIÓN DESDE EL MUNDO CAUSAL';detail.textContent='puente fotográfico→Ω todavía no conectado'}}async function sync(){try{state=await fetch(`world-state.json?${Date.now()}`,{cache:'no-store'}).then(r=>r.json());hud()}catch{st.textContent='RECONECTANDO'}}buttons();setLayer(layer);sync();setInterval(sync,15000);</script>
