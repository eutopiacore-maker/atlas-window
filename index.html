<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Atlas Reality Stack</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100d;color:#f7f4ed;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}#view,#photo{position:fixed;inset:0;width:100%;height:100%;border:0}#view{z-index:1;background:#07100d}#photo{z-index:2;display:none;background-position:center;background-size:cover;background-repeat:no-repeat;background-color:#07100d}#photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0005 0%,transparent 25%,transparent 70%,#0007 100%);pointer-events:none}#hud{position:fixed;inset:0;z-index:5;pointer-events:none;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));text-shadow:0 2px 12px #000}.glass{background:#07100db8;border:1px solid #efbd6860;backdrop-filter:blur(14px);border-radius:16px}.brand{position:absolute;left:16px;top:max(16px,env(safe-area-inset-top));padding:12px 15px;letter-spacing:.2em;font-size:12px}.brand strong{color:#efbd68}.place{position:absolute;left:18px;top:115px}.place b{font-size:28px;letter-spacing:.09em}.place div{font-size:11px;margin-top:6px}.mode{position:absolute;top:max(20px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto;white-space:nowrap}.mode button{border:1px solid #efbd6860;background:#07100dd9;color:#eee;border-radius:16px;padding:9px 12px;font:10px -apple-system,sans-serif;letter-spacing:.05em}.mode button.on{border-color:#efbd68;color:#efbd68}.mode button.omega{border-color:#8fbcff66}.mode button.omega.on{border-color:#8fbcff;color:#b9d5ff}.status{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top));padding:11px 14px;text-align:right;line-height:1.55}.bottom{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:10px 14px;display:flex;justify-content:space-between;gap:10px;font-size:10px}.bottom span:last-child{text-align:right;color:#c9cfcc}.badge{position:absolute;right:16px;top:115px;padding:9px 12px;font-size:10px;line-height:1.45;display:none}.badge strong{color:#efbd68}@media(max-width:760px){.mode{top:100px;gap:4px}.mode button{padding:7px 7px;font-size:8px}.place{top:158px}.place b{font-size:23px}.status{font-size:10px}.brand{font-size:10px}.bottom{font-size:9px}.badge{top:158px}}</style><iframe id="view" src="world.html?layer=1"></iframe><div id="photo"></div><div id="hud"><div class="glass brand"><strong>ATLAS</strong><br>REALITY STACK</div><div class="place"><b>PENONOMÉ</b><div id="geo">conectando geografía…</div></div><div class="mode"><button id="b1">CAPA 1 · ESTADO</button><button id="b2">CAPA 2 · DINÁMICA</button><button id="b3">CAPA 3 · APARIENCIA</button><button id="bo" class="omega">Ω</button></div><div class="glass status"><b id="st">REALITY</b><br><span id="stats">conectando mundo…</span></div><div id="decoder" class="glass badge"><strong>CAPA 3 FOTOGRÁFICA</strong><br><span id="decstate">decoder local</span></div><div class="glass bottom"><span id="truth">SIR · VERIFICANDO</span><span id="detail">leyendo realidad…</span></div></div><script type="module">import{buildAppearanceScenePacket}from'./appearance-scene.js';const V=document.getElementById('view'),P=document.getElementById('photo'),D=document.getElementById('decoder');let state=null,params=new URLSearchParams(location.search),layer=Math.max(1,Math.min(3,+params.get('layer')||1)),omega=params.get('omega')==='1',packet=null,localData=null,localLoading=null;function buttons(){b1.classList.toggle('on',layer===1&&!omega);b2.classList.toggle('on',layer===2&&!omega);b3.classList.toggle('on',layer===3&&!omega);bo.classList.toggle('on',omega)}function hideChildHud(){try{const d=V.contentDocument,e=d?.getElementById('hud');if(e)e.style.display='none'}catch{}}function child(src){if(!V.src.endsWith(src))V.src=src;else hideChildHud()}function url(){let q=new URLSearchParams;q.set('layer',layer);if(omega)q.set('omega','1');history.replaceState(0,'',`${location.pathname}?${q}`)}function showIframe(src){P.style.display='none';D.style.display='none';V.style.display='block';child(src)}function setLayer(n){layer=n;omega=false;buttons();url();render()}function setOmega(){omega=!omega;buttons();url();render()}b1.onclick=()=>setLayer(1);b2.onclick=()=>setLayer(2);b3.onclick=()=>setLayer(3);bo.onclick=setOmega;V.onload=hideChildHud;function cameraPacket(){return{fov:58,height_m:1.65,yaw_deg:null,pitch_deg:null,position:null}}async function fallbackFrame(){if(localData)return localData;if(localLoading)return localLoading;localLoading=(async()=>{const b=(await fetch(`appearance/reference/penonome-inline.txt?${Date.now()}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('payload HTTP '+r.status);return r.text()})).trim();if(!b.startsWith('/9j/'))throw Error('invalid jpeg payload');const data=`data:image/jpeg;base64,${b}`;await new Promise((ok,no)=>{const i=new Image;i.onload=ok;i.onerror=()=>no(Error('jpeg decode failed'));i.src=data});localData=data;return data})().finally(()=>localLoading=null);return localLoading}async function appearance(){if(!state||layer!==3||omega)return;packet=buildAppearanceScenePacket(state,cameraPacket());window.__ATLAS_SCENE_PACKET__=packet;try{if(window.AtlasPhotorealDecoder?.render){const frame=await window.AtlasPhotorealDecoder.render(packet);if(frame){await new Promise((ok,no)=>{const i=new Image;i.onload=ok;i.onerror=no;i.src=frame});P.style.backgroundImage=`url(${JSON.stringify(frame)})`;P.style.display='block';V.style.display='none';D.style.display='block';decstate.textContent='DECODER LIVE · estado + dinámica → frame';truth.textContent='CAPA 1 + CAPA 2 → CAPA 3 FOTOGRÁFICA';detail.textContent='apariencia inferida · causalidad intacta';return}}}catch{}try{const data=await fallbackFrame();if(layer!==3||omega)return;P.style.backgroundImage=`url(${JSON.stringify(data)})`;P.style.display='block';V.style.display='none';D.style.display='block';decstate.textContent='KEYFRAME LOCAL · decoder live offline';truth.textContent='ESTADO + DINÁMICA → SCENE PACKET → APARIENCIA';detail.textContent='referencia integrada · no es inferencia live'}catch(e){showIframe('world.html?layer=2');D.style.display='block';decstate.textContent='FALLBACK PROCEDURAL · referencia no disponible';truth.textContent='CAPA 3 · FALLBACK CONTEXTUAL';detail.textContent=e.message||'decoder offline'}}function render(){buttons();if(omega){showIframe('world.html?layer=3');if(state){st.textContent='MODO Ω · SALIDA BINOCULAR';stats.textContent='L/R simultáneo · fuente geométrica causal';truth.textContent='Ω · MODO DE SALIDA, NO CAPA DEL MUNDO';detail.textContent='fotoreal estéreo pendiente de decoder dual-view'}return}if(layer===1)showIframe('world.html?layer=1');else if(layer===2)showIframe('dynamics.html');else appearance();hud()}function hud(){if(!state)return;const a=state.geo?.anchor,g=state.physics?.gravityUsed_m_s2||state.physicsConstants?.values?.WGS84NormalGravityAtAnchor_m_s2||9.80665;geo.textContent=a?`${(+a.lat).toFixed(5)}° N, ${Math.abs(+a.lon).toFixed(5)}° W · ${a.source==='miambienteMunicipalHead'||state.provenance?.checks?.anati?.ok?'oficial':'provisional'}`:'ancla pendiente';if(omega)return;if(layer===1){st.textContent=`CAPA 1 · ESTADO · CICLO ${state.cycle}`;stats.textContent=`${state.metrics?.cells||state.grid?.cells?.length||0} celdas · ${state.metrics?.population||0} entidades`;truth.textContent='QUÉ EXISTE · DÓNDE · EN QUÉ ESTADO';detail.textContent=`${state.grid?.cellMeters||'?'}m · g ${(+g).toFixed(6)} · Δagua ${state.metrics?.waterMassResidual_L??'—'}L`}else if(layer===2){st.textContent=`CAPA 2 · DINÁMICA · CICLO ${state.cycle}`;stats.textContent='interpolación causal · intención · viento';truth.textContent='QUÉ ESTÁ PASANDO';detail.textContent='movimiento solo entre estados confirmados · objetivos visibles'}else{st.textContent=`CAPA 3 · APARIENCIA · CICLO ${state.cycle}`;stats.textContent='traducción visual fotográfica';appearance()}}async function sync(){try{state=await fetch(`world-state.json?${Date.now()}`,{cache:'no-store'}).then(r=>r.json());render()}catch{st.textContent='RECONECTANDO'}}buttons();sync();setInterval(sync,15000);</script>
