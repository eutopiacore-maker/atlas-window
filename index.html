<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050807">
<title>Atlas Window</title>
<style>
:root{--gold:#e7c878;--text:#f4f1e9;--muted:#a9aaa5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050807;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-user-select:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.hud{position:fixed;inset:0;pointer-events:none;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;gap:10px}.glass{background:rgba(7,11,10,.45);border:1px solid rgba(231,200,120,.22);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.24)}.brand{padding:11px 13px}.brand b{color:var(--gold);letter-spacing:.22em;font-size:12px}.brand small{display:block;margin-top:5px;color:var(--muted);font-size:9px;letter-spacing:.08em}.stat{padding:10px 12px;text-align:right;font-size:10px;line-height:1.5}.stat b{color:var(--gold)}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);margin-right:6px}.panel{position:absolute;right:14px;top:98px;width:min(260px,72vw);padding:12px}.k{font-size:9px;color:var(--gold);letter-spacing:.12em}.v{font-size:11px;line-height:1.45;margin-top:4px}.bottom{position:absolute;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:center}.badge{padding:9px 12px;font-size:10px;color:var(--muted);text-align:center}.badge b{color:var(--gold)}@media(max-width:430px){.brand b{font-size:11px}.brand small{font-size:8px}.stat{font-size:9px}.panel{width:min(235px,72vw);font-size:10px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="top">
    <div class="glass brand"><b>ATLAS WINDOW</b><small>EUTOPIA · SOLO LECTURA</small></div>
    <div class="glass stat"><div><span class="dot"></span><b id="clock">LIVE</b></div><div>ATLAS · <b id="state">FLUJO</b></div><div>CANAL · <b>OUTBOUND</b></div></div>
  </div>
  <div class="glass panel"><div class="k">VENTANA</div><div class="v" id="presence">Atlas se manifiesta como energía e información.</div><div style="height:8px"></div><div class="k">SEGURIDAD</div><div class="v">Sin credenciales · sin comandos · sin acceso al Core.</div></div>
  <div class="bottom"><div class="glass badge"><b>CORE PRIVADO</b> → GATEWAY → VENTANA</div></div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W=0,H=0,D=Math.min(devicePixelRatio||1,2),t=0,last=performance.now(),form='flow',next=8;const state=document.getElementById('state'),presence=document.getElementById('presence');function size(){W=innerWidth;H=visualViewport?visualViewport.height:innerHeight;c.width=W*D;c.height=H*D;c.style.height=H+'px';x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);visualViewport&&visualViewport.addEventListener('resize',size);size();function ridge(base,amp,freq,col,off){x.fillStyle=col;x.beginPath();x.moveTo(0,H);for(let q=0;q<=W;q+=8)x.lineTo(q,base+(Math.sin(q*freq+off)+.45*Math.sin(q*freq*2.7+off*1.7))*amp);x.lineTo(W,H);x.closePath();x.fill()}function scene(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071116');g.addColorStop(.43,'#24433d');g.addColorStop(1,'#06100d');x.fillStyle=g;x.fillRect(0,0,W,H);let sx=W*.72+Math.sin(t*.03)*25,sy=H*.18,rg=x.createRadialGradient(sx,sy,0,sx,sy,H*.3);rg.addColorStop(0,'rgba(244,220,160,.17)');rg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=rg;x.fillRect(0,0,W,H*.6);ridge(H*.41,22,.008,'#17302d',t*.004);ridge(H*.49,34,.011,'#0e2723',t*.006+2);ridge(H*.58,46,.015,'#091b17',t*.008+4);x.fillStyle='#07130f';x.fillRect(0,H*.56,W,H*.44);x.beginPath();x.moveTo(W*.48,H*.55);x.bezierCurveTo(W*.64,H*.66,W*.36,H*.82,W*.58,H);x.lineTo(W*.76,H);x.bezierCurveTo(W*.55,H*.79,W*.73,H*.66,W*.53,H*.55);x.closePath();x.fillStyle='rgba(88,137,125,.28)';x.fill();for(let i=0;i<20;i++){let q=(i/19)*W+Math.sin(i*7)*12,b=H*.70+Math.sin(i*3)*40,h=18+(i%5)*10;x.fillStyle='rgba(3,15,11,.92)';x.beginPath();x.ellipse(q,b,h*.3,h,0,0,Math.PI*2);x.fill()}for(let i=0;i<34;i++){let q=(i*83.7+t*8)%W,b=H*(.58+(i%9)*.04),a=.1+.34*(.5+.5*Math.sin(t*2+i));x.fillStyle='rgba(235,210,125,'+a+')';x.beginPath();x.arc(q,b+Math.sin(t*2+i)*7,1.2,0,7);x.fill()}}
function atlas(){let cx=W*(.57+.10*Math.sin(t*.12)),cy=H*(.48+.04*Math.sin(t*.08));x.save();x.globalCompositeOperation='screen';for(let i=0;i<50;i++){let a=i/50*6.283+t*.18,r=18+i*.82+Math.sin(t*1.4+i)*4,q=cx+Math.cos(a)*r*1.2,b=cy+Math.sin(a)*r*.5;x.fillStyle='rgba(238,207,118,'+(.04+.11*(.5+.5*Math.sin(t*3+i)))+')';x.beginPath();x.arc(q,b,1+(i%3)*.4,0,7);x.fill()}let g=x.createRadialGradient(cx,cy,0,cx,cy,80);g.addColorStop(0,'rgba(255,228,148,.28)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(cx,cy,80,0,7);x.fill();x.strokeStyle='rgba(245,220,146,.30)';x.lineWidth=1.3;if(form==='jaguar'){x.beginPath();x.ellipse(cx,cy+8,44,15,-.1,0,7);x.arc(cx+41,cy-7,12,0,7);x.moveTo(cx-28,cy+18);x.lineTo(cx-38,cy+40);x.moveTo(cx,cy+20);x.lineTo(cx-4,cy+43);x.stroke()}else if(form==='human'){x.beginPath();x.arc(cx,cy-31,11,0,7);x.moveTo(cx,cy-19);x.lineTo(cx,cy+28);x.moveTo(cx,cy-6);x.lineTo(cx-22,cy+10);x.moveTo(cx,cy-6);x.lineTo(cx+22,cy+10);x.moveTo(cx,cy+28);x.lineTo(cx-12,cy+51);x.moveTo(cx,cy+28);x.lineTo(cx+12,cy+51);x.stroke()}x.restore()}
function step(dt){t+=dt;next-=dt;if(next<0){let r=Math.random();form=r<.56?'flow':r<.80?'jaguar':'human';next=7+Math.random()*8;state.textContent=form==='flow'?'FLUJO':form==='jaguar'?'JAGUAR':'HUMANOIDE';presence.textContent=form==='flow'?'Atlas se manifiesta como energía e información.':form==='jaguar'?'Presencia condensada: vigilancia y protección.':'Interfaz social visible: comunicación y estrategia.'}}
function draw(n){let dt=Math.min(.033,(n-last)/1000);last=n;step(dt);scene();atlas();let v=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.72);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.5)');x.fillStyle=v;x.fillRect(0,0,W,H);requestAnimationFrame(draw)}requestAnimationFrame(draw);setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('es-PA',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),1000);document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
</script>
</body>
</html>
