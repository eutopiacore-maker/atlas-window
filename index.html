<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#020607"><title>Atlas Window</title><style>:root{--g:#efbd68;--glass:rgba(4,8,10,.38);--line:rgba(239,189,104,.24);--t:#f7f4ed;--m:#b7bdbe}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020607;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}#scene{position:fixed;inset:-4%;width:108%;height:108%;object-fit:cover;filter:saturate(.92) contrast(1.03);transform:scale(1.04);transition:filter .5s;will-change:transform}.night #scene{filter:brightness(.52) saturate(.75) hue-rotate(7deg)}#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(1,5,7,.15),rgba(1,5,7,0) 48%,rgba(1,5,7,.48));pointer-events:none}.hud{position:fixed;inset:0;z-index:5;padding:max(15px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));pointer-events:none}.top{display:flex;justify-content:space-between;gap:10px}.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-radius:18px;box-shadow:0 12px 36px rgba(0,0,0,.22)}.brand{padding:10px 12px}.brand b{letter-spacing:.27em;font-size:12px}.brand small{display:block;margin-top:4px;color:var(--g);letter-spacing:.28em;font-size:8px}.live{padding:10px 12px;font-size:10px;line-height:1.55;text-align:right}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#70d776;box-shadow:0 0 11px #70d776;margin-right:6px}.place{position:absolute;left:18px;top:15%;text-shadow:0 2px 16px #000}.place h1{font-size:24px;letter-spacing:.13em;margin:0 0 6px}.place div{font-size:10px;line-height:1.75;letter-spacing:.08em}.atlas{position:absolute;right:16px;top:19%;width:min(210px,44vw);padding:12px}.atlas b{display:block;color:var(--g);font-size:9px;letter-spacing:.12em;margin-bottom:6px}.atlas div{font-size:10px;line-height:1.55}.controls{position:absolute;right:14px;bottom:19%;display:grid;gap:7px;pointer-events:auto}.controls button{width:60px;height:60px;border-radius:15px;border:1px solid rgba(255,255,255,.08);background:rgba(3,8,10,.62);color:#fff;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:9px}.controls strong{display:block;font-size:18px;margin-bottom:3px}.status{position:absolute;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));padding:11px 13px;display:flex;justify-content:space-between;gap:12px;align-items:center}.status b{color:var(--g);font-size:9px;letter-spacing:.11em}.status span{font-size:9px;color:var(--m);text-align:right}.immersive .hud{opacity:0;pointer-events:none}.hud{transition:opacity .35s}.wake{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(circle at 50% 48%,rgba(239,189,104,.14),transparent 34%)}.atlas-presence .wake{opacity:1}@media(max-height:720px){.place{top:13%}.atlas{top:16%}.controls{bottom:21%}}</style></head><body><img id="scene" alt="Penonomé — Atlas spatial projection"><canvas id="fx"></canvas><div class="shade"></div><div class="wake"></div><div class="hud"><div class="top"><div class="glass brand"><b>ATLAS</b><small>VENTANA</small></div><div class="glass live"><div><span class="dot"></span><span id="worldState">MEMORIA ESPACIAL</span></div><div id="sourceState">conectando fuentes…</div></div></div><div class="place"><h1>PENONOMÉ</h1><div>COCLÉ, PANAMÁ<br>8.51208° N, 80.35468° W<br><span id="clock">--:--:--</span></div></div><div class="glass atlas"><b>ATLAS</b><div id="atlasLine">Estoy construyendo una representación persistente del lugar, no una animación repetida.</div></div><div class="controls"><button id="day"><strong>☀</strong>DÍA</button><button id="night"><strong>☾</strong>NOCHE</button><button id="immersive"><strong>◉</strong>INMERSIVO</button></div><div class="glass status"><b id="cell">PA.COCLE.PENONOME</b><span id="facts">cargando contexto oficial…</span></div></div><script>
const scene=document.getElementById('scene'),fx=document.getElementById('fx'),ctx=fx.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,2),t=0,tx=0,ty=0,cx=0,cy=0,wind=.18,particles=[],cars=[],birds=[];function resize(){W=innerWidth;H=visualViewport?visualViewport.height:innerHeight;fx.width=W*D;fx.height=H*D;fx.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);visualViewport&&visualViewport.addEventListener('resize',resize);resize();
fetch('atlas-bg.txt?'+Date.now()).then(r=>r.text()).then(b=>{scene.src='data:image/webp;base64,'+b.trim()}).catch(()=>{});
for(let i=0;i<70;i++)particles.push({x:Math.random(),y:.45+Math.random()*.5,p:Math.random()*6.28,s:.2+Math.random()*.7});for(let i=0;i<11;i++)cars.push({u:Math.random(),s:.025+Math.random()*.035,p:Math.random()});for(let i=0;i<7;i++)birds.push({x:Math.random(),y:.25+Math.random()*.26,s:.01+Math.random()*.008,p:Math.random()*6.28});
function orient(x,y){tx=Math.max(-1,Math.min(1,x));ty=Math.max(-1,Math.min(1,y))}addEventListener('deviceorientation',e=>{if(e.gamma!=null)orient(e.gamma/24,e.beta/35)});let sx,sy;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});addEventListener('touchmove',e=>{if(sx!=null)orient((e.touches[0].clientX-sx)/180,(e.touches[0].clientY-sy)/220)},{passive:true});addEventListener('touchend',()=>{sx=sy=null});
function render(n){t=n/1000;cx+=(tx-cx)*.035;cy+=(ty-cy)*.035;scene.style.transform=`translate(${cx*-14}px,${cy*-9}px) scale(1.065)`;ctx.clearRect(0,0,W,H);ctx.save();ctx.globalCompositeOperation='screen';for(const p of particles){let x=((p.x+t*p.s*.006)%1)*W,y=p.y*H+Math.sin(t*.8+p.p)*7,a=.12+.25*(.5+.5*Math.sin(t*1.7+p.p));ctx.fillStyle=`rgba(239,189,104,${a})`;ctx.beginPath();ctx.arc(x,y,1.1,0,7);ctx.fill()}ctx.restore();ctx.strokeStyle='rgba(235,242,240,.26)';ctx.lineWidth=1;for(const b of birds){let x=((b.x+t*b.s)%1)*W,y=b.y*H+Math.sin(t*.7+b.p)*9;ctx.beginPath();ctx.arc(x,y,5,3.5,5.7);ctx.arc(x+9,y,5,3.7,5.9);ctx.stroke()}for(const c of cars){c.u=(c.u+c.s/60)%1;let y=H*(.69+c.u*.24),x=W*(.55+.17*Math.sin(c.u*2.7));ctx.fillStyle=c.p>.5?'rgba(255,221,155,.72)':'rgba(210,55,42,.58)';ctx.beginPath();ctx.arc(x,y,1.6+3*c.u,0,7);ctx.fill()}requestAnimationFrame(render)}requestAnimationFrame(render);
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString('es-PA',{hour:'2-digit',minute:'2-digit',second:'2-digit'})},1000);
document.getElementById('day').onclick=()=>document.body.classList.remove('night');document.getElementById('night').onclick=()=>document.body.classList.add('night');document.getElementById('immersive').onclick=()=>document.body.classList.toggle('immersive');document.body.addEventListener('click',()=>document.body.classList.toggle('atlas-presence'));
async function officialContext(){const s=document.getElementById('sourceState'),f=document.getElementById('facts');try{const u='https://sigigntg.anati.gob.pa/arcgisserver/rest/services/Mapa_Web_de_Poblados_2025_MIL1/MapServer/2/query?where=1%3D1&outFields=NOMBRE_TOPONIMO%2CLMDI_NOMB_1%2CLMPR_NOMB_1&returnGeometry=false&f=json';const j=await fetch(u).then(r=>r.json());const hit=(j.features||[]).find(v=>(v.attributes?.NOMBRE_TOPONIMO||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes('penonome'));s.textContent='IGN PANAMÁ · EN VIVO';f.textContent=hit?'cabecera distrital verificada · cartografía oficial 2025':'fuente oficial conectada';}catch(e){s.textContent='MEMORIA LOCAL · OFFLINE';f.textContent='la escena sigue estable; fuente oficial temporalmente no disponible'}}officialContext();
</script><script src="live-world.js"></script></body></html>
