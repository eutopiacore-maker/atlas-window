<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Atlas Layer 1</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#07100d;color:#dce5df;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto}body{box-sizing:border-box;padding:86px 18px 28px}.title{font:600 14px -apple-system,sans-serif;letter-spacing:.12em;color:#efbd68;margin-bottom:16px}.sub{font:12px -apple-system,sans-serif;color:#9eaaa4;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr;gap:10px}.card{border:1px solid #efbd6838;border-radius:14px;background:#0b1512;padding:12px}.k{font-size:10px;color:#efbd68;letter-spacing:.08em;margin-bottom:6px}.v{font-size:12px;line-height:1.45;white-space:pre-wrap;word-break:break-word}pre{margin:12px 0 0;border:1px solid #ffffff16;border-radius:14px;background:#050907;padding:12px;font-size:10px;line-height:1.42;white-space:pre-wrap;word-break:break-word;color:#b9c6bf}.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:#56c889;margin-right:6px;box-shadow:0 0 12px #56c88980}
</style>
<div class="title"><span class="pulse"></span>CAPA 1 · NÚCLEO</div>
<div class="sub">Estado fundamental de la simulación. Aquí no se dibuja el mundo: se define.</div>
<div class="grid">
  <div class="card"><div class="k">UBICACIÓN / ESPACIO</div><div id="geo" class="v">cargando…</div></div>
  <div class="card"><div class="k">MATERIA / MEDIO</div><div id="matter" class="v">cargando…</div></div>
  <div class="card"><div class="k">EVOLUCIÓN / TIEMPO</div><div id="evo" class="v">cargando…</div></div>
  <div class="card"><div class="k">ENTIDADES / ESTADO</div><div id="entities" class="v">cargando…</div></div>
</div>
<pre id="raw">cargando estado…</pre>
<script>
(function(){
function n(v,d){return Number.isFinite(Number(v))?Number(v):d}
function txt(o){return JSON.stringify(o,null,2)}
async function sync(){
 try{
  var r=await fetch('world-state.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);var w=await r.json();
  var loc=w.location||w.geo||{};var g=w.grid||{};var weather=w.weather||{};var metrics=w.metrics||{};
  document.getElementById('geo').textContent=txt({name:loc.name||w.name||'Penonomé',lat:loc.lat??w.lat??null,lon:loc.lon??w.lon??null,grid:{w:g.w,h:g.h,cellMeters:g.cellMeters},reference:w.reference||null});
  document.getElementById('matter').textContent=txt({weather:weather,soilMoisture:metrics.meanSoilMoisture??null,water:metrics.totalWaterL??metrics.waterL??null,plants:(w.plants||[]).length,cells:(g.cells||[]).length});
  document.getElementById('evo').textContent=txt({cycle:w.cycle??w.tick??null,time:w.time??null,dt:w.dt??null,version:w.version??null});
  document.getElementById('entities').textContent=txt({agents:(w.agents||[]).length,atlas:w.atlas||null,plants:(w.plants||[]).length});
  document.getElementById('raw').textContent=txt(w);
 }catch(e){document.getElementById('raw').textContent='ERROR: '+e.message}
}
sync();setInterval(sync,5000);
})();
</script>
