<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Atlas World Renderer</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9db7c1;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';
const qs=new URLSearchParams(location.search), layer=Math.max(1,Math.min(3,+qs.get('layer')||1));
const scene=new T.Scene(), camera=new T.PerspectiveCamera(58,innerWidth/innerHeight,.1,300), stereo=new T.StereoCamera();
const renderer=new T.WebGLRenderer({antialias:true,alpha:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.02;renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
const group=new T.Group();scene.add(group);const hemi=new T.HemisphereLight(0xdcecff,0x443826,1.4),sun=new T.DirectionalLight(0xffd7a0,2.8);sun.position.set(-18,24,16);sun.castShadow=true;scene.add(hemi,sun);
let W=null,z=.315,b0=0,ys=.12;
const mat=(c,r=.9)=>new T.MeshStandardMaterial({color:c,roughness:r});
function wipe(){while(group.children.length){const o=group.children.pop();o.traverse?.(n=>{n.geometry?.dispose?.();if(Array.isArray(n.material))n.material.forEach(m=>m.dispose?.());else n.material?.dispose?.()})}}
function cell(w,x,y){x=Math.max(0,Math.min(w.grid.w-1,x));y=Math.max(0,Math.min(w.grid.h-1,y));return w.grid.cells[y*w.grid.w+x]}
function elev(q){return((+q?.elevation||0)-b0)*ys}
function E(w,x,y){return elev(cell(w,Math.floor(x*w.grid.w),Math.floor(y*w.grid.h)))}
function P(w,x,y){return[(x-.5)*(w.grid.w-1)*z,(y-.5)*(w.grid.h-1)*z]}
function ground(w){const v=[],co=[],ix=[];for(let y=0;y<w.grid.h;y++)for(let x=0;x<w.grid.w;x++){const q=cell(w,x,y),m=q.soil?.moisture||0,o=q.soil?.organic||0,c=new T.Color().setHSL(.10+o*.025,.28+o*.15,.42+m*.08);v.push((x-(w.grid.w-1)/2)*z,elev(q),(y-(w.grid.h-1)/2)*z);co.push(c.r,c.g,c.b)}for(let y=0;y<w.grid.h-1;y++)for(let x=0;x<w.grid.w-1;x++){const a=y*w.grid.w+x,b=a+1,d=a+w.grid.w,e=d+1;ix.push(a,d,b,b,d,e)}const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(v,3));g.setAttribute('color',new T.Float32BufferAttribute(co,3));g.setIndex(ix);g.computeVertexNormals();const m=new T.Mesh(g,new T.MeshStandardMaterial({vertexColors:true,roughness:.98}));m.receiveShadow=true;group.add(m)}
function plant(w,p){const[x,d]=P(w,p.x,p.y),y=E(w,p.x,p.y),kind=p.kind||p.species,bio=Math.max(.02,p.biomassKg??p.biomass??.02);if(kind==='grass'){const h=.08+Math.min(.45,bio*.7),q=new T.Mesh(new T.ConeGeometry(.018,h,4),mat(0x32663a));q.position.set(x,y+h/2,d);group.add(q)}else{const s=.3+Math.min(.8,Math.sqrt(bio)*.25),tr=new T.Mesh(new T.CylinderGeometry(.025,.045,.4*s,6),mat(0x65472e)),le=new T.Mesh(new T.IcosahedronGeometry(.18*s,1),mat(0x315b37));tr.position.set(x,y+.2*s,d);le.position.set(x,y+.48*s,d);group.add(tr,le)}}
function person(w,a,isAtlas=false){const[x,d]=P(w,a.x,a.y),y=E(w,a.x,a.y),k=isAtlas?1.02:.78,c=isAtlas?0xd39a34:0xe3d8c5,g=new T.Group(),body=new T.Mesh(new T.CapsuleGeometry(.12*k,.38*k,3,6),mat(c,.84)),head=new T.Mesh(new T.SphereGeometry(.15*k,10,8),mat(c,.82));body.position.y=.5*k;head.position.y=.96*k;g.add(body,head);g.position.set(x,y,d);g.traverse(n=>{if(n.isMesh)n.castShadow=true});group.add(g)}
function draw(w){W=w;wipe();z=(w.grid.cellMeters||4.5)*.07;b0=Math.min(...w.grid.cells.map(q=>+q.elevation||0));const cloud=w.weather?.cloud??.5,solar=w.weather?.solar??.5;scene.background=new T.Color().setHSL(.55-.03*solar,.28,.55+.2*solar-cloud*.05);scene.fog=new T.FogExp2(scene.background,.028+cloud*.01);hemi.intensity=.9+solar*1.8;sun.intensity=.5+solar*3.6;ground(w);for(const p of w.representation?.entities?.plants||w.plants||[])plant(w,p);for(const a of w.representation?.entities?.agents||w.agents||[])person(w,a,false);const at=w.representation?.entities?.atlas||w.atlas;if(at)person(w,at,true)}
async function sync(){try{const r=await fetch('world-state.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);draw(await r.json())}catch(e){console.error('Atlas world state load failed',e)}}
let target=new T.Vector3(0,1.0,0),yaw=.72,pitch=-.13,dist=8.2,drag=false,lx=0,ly=0;function cam(){const p=Math.cos(pitch);camera.position.set(target.x+Math.sin(yaw)*p*dist,target.y+Math.sin(-pitch)*dist,target.z+Math.cos(yaw)*p*dist);camera.lookAt(target);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}cam();renderer.domElement.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY};addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*.006;pitch=Math.max(-.48,Math.min(-.05,pitch-(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY;cam()});
function loop(){requestAnimationFrame(loop);if(layer!==3){renderer.setScissorTest(false);renderer.setViewport(0,0,innerWidth,innerHeight);renderer.render(scene,camera);return}stereo.eyeSep=.064;stereo.update(camera);const h=innerHeight,w=innerWidth/2;renderer.setScissorTest(true);renderer.setViewport(0,0,w,h);renderer.setScissor(0,0,w,h);renderer.render(scene,stereo.cameraL);renderer.setViewport(w,0,w,h);renderer.setScissor(w,0,w,h);renderer.render(scene,stereo.cameraR);renderer.setScissorTest(false)}
sync();setInterval(sync,15000);loop();addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam()});
</script>
